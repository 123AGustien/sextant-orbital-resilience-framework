name: 🛰️ Master Orchestrator

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  # ---------------------------------
  # BUILD DOCUMENTATION + ARTIFACTS
  # ---------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------
      # OPTIONAL: VALIDATE FRAMEWORK STRUCTURE
      # ---------------------------------
      - name: Validate framework import integrity
        run: |
          python -c "print('🛰️ Framework structure OK')"

      # ---------------------------------
      # BUILD DOCS OUTPUT (STATIC SITE)
      # ---------------------------------
      - name: Prepare docs directory
        run: |
          mkdir -p docs
          echo "<h1>Sextant Orbital Resilience Framework</h1>" > docs/index.html
          echo "<p>Simulation-based system architecture active.</p>" >> docs/index.html

      # ---------------------------------
      # UPLOAD ARTIFACT FOR GITHUB PAGES
      # ---------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs


  # ---------------------------------
  # DEPLOY TO GITHUB PAGES
  # ---------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
