name: 🛰️ Master Orchestrator

on:
  push:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:

  # ---------------------------------
  # BUILD + LOAD SCENARIOS
  # ---------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------
      # VERIFY CORE IMPORTS
      # ---------------------------------
      - name: Validate core framework imports
        run: |
          python -c "print('🛰️ Core modules OK')"

      # ---------------------------------
      # EXECUTE ORBITAL SCENARIOS
      # ---------------------------------
      - name: Run Orbital Scenario Execution
        run: |
          python - << 'EOF'
          import json
          import glob

          print("🛰️ Running Orbital Scenarios")

          for file in glob.glob("scenarios/orbital/*.json"):
              with open(file) as f:
                  scenario = json.load(f)

              print(f"✔ Loaded {scenario['scenario_id']}")

              assert "domain" in scenario
              assert scenario["domain"] == "orbital"

              print("✔ Orbital scenario validated")
          EOF

      # ---------------------------------
      # EXECUTE TRANSPORT SCENARIOS
      # ---------------------------------
      - name: Run Transport Scenario Execution
        run: |
          python - << 'EOF'
          import json
          import glob

          print("🚆 Running Transport Scenarios")

          for file in glob.glob("scenarios/transport/*.json"):
              with open(file) as f:
                  scenario = json.load(f)

              print(f"✔ Loaded {scenario['scenario_id']}")

              assert "domain" in scenario
              assert scenario["domain"] == "transport"

              print("✔ Transport scenario validated")
          EOF

      # ---------------------------------
      # BUILD STATIC OUTPUT
      # ---------------------------------
      - name: Build docs output
        run: |
          mkdir -p docs
          echo "<h1>Sextant Simulation Active</h1>" > docs/index.html
          echo "<p>Scenarios executed successfully.</p>" >> docs/index.html

      # ---------------------------------
      # UPLOAD ARTIFACT
      # ---------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs


  # ---------------------------------
  # DEPLOY
  # ---------------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
