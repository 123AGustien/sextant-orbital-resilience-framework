# ============================================================
# 🛰️ SEXTANT MASTER ORCHESTRATOR
#
# Sextant Orbital Resilience Framework v2.4
#
# Deterministic simulation validation and GitHub Pages artifact
# generation.
#
# ARCHITECTURE:
#
# OrbitalEngineV1
#        ↓
# ManoeuvreEngineV1
#        ↓
# FailsafeTransitionEngineV1
#        ↓
# CommandCentreCoreV3
#        ↓
# Cascade Resilience Index
#        ↓
# ValidationCoreV1
#        ↓
# ValidationChecklistV1
#        ↓
# MemoryCoreV1
#        ↓
# AuditCoreV1
#        ↓
# Captain AI Lena Decision Support
#        ↓
# FINAL HUMAN DECISION
#        ↓
# SIMULATED ACTION / SAFE STATE
#
# SAFETY:
# Automatic execution = FALSE
# Human authorization = REQUIRED
# Simulation only = TRUE
# Live system control = FALSE
#
# BRANCH GOVERNANCE:
#
# Feature branches:
#   VALIDATION + ARTIFACT ONLY
#
# Main branch:
#   VALIDATION + GITHUB PAGES DEPLOYMENT
#
# Protected github-pages environment:
#   MAIN ONLY
#
# IMPORTANT:
# This workflow does NOT issue spacecraft commands,
# propulsion commands, navigation commands, or live control.
# ============================================================

name: "Sextant Master Orchestrator"

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - feature/orbital-domain-engine-v1
      - feature/trial-manoeuvre-engine
      - feature/trial-manoeuvre-simulation-layer
      - feature/cascade-resilience-index
      - feature/command-centre-core-v3

permissions:
  contents: read

concurrency:
  group: sextant-stable-run
  cancel-in-progress: true


# ============================================================
# SIMULATION / VALIDATION
# ============================================================

jobs:

  simulate:

    name: "Orbital Simulation Validation"

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: "Checkout repository"
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ======================================================
      # PYTHON
      # ======================================================

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # SYSTEM HEALTH
      # ======================================================

      - name: "System health check"
        run: |
          echo "🛰️ Sextant Framework Online"
          echo "Orbital Resilience Cockpit v2.4"
          echo "Command-Centre Core v3 integration active"
          echo "Cascade Resilience Index integration active"
          echo "ValidationChecklistV1 integration active"
          echo "Simulation-only safety boundary active"
          echo "Human decision authority required"
          echo "Live system control NOT CONNECTED"


      # ======================================================
      # MODULE STRUCTURE VALIDATION
      # ======================================================

      - name: "Verify Sextant modules"
        run: |
          set -e

          echo "Checking simulation architecture..."

          # --------------------------------------------------
          # Core HTML
          # --------------------------------------------------

          test -f index.html

          # --------------------------------------------------
          # Root supervisory modules
          # --------------------------------------------------

          test -f commandCentreCoreV3.js
          test -f cascade-resilience-index.html

          # --------------------------------------------------
          # Orbital modules
          # --------------------------------------------------

          test -f js/orbitalProfiles.js
          test -f js/orbitalEngine.js

          # --------------------------------------------------
          # Manoeuvre modules
          # --------------------------------------------------

          test -f js/manoeuvreProfiles.js
          test -f js/manoeuvreEngine.js

          # --------------------------------------------------
          # Failsafe modules
          # --------------------------------------------------

          test -f js/failsafeProfiles.js
          test -f js/failsafeEngine.js

          # --------------------------------------------------
          # Navigation
          # --------------------------------------------------

          test -f js/navigationCore.js

          # --------------------------------------------------
          # Validation modules
          # --------------------------------------------------

          test -f js/validationCore.js
          test -f js/validationChecklist.js

          # --------------------------------------------------
          # Validation loader
          # --------------------------------------------------

          test -f validation-loader.js

          # --------------------------------------------------
          # Validation evidence
          # --------------------------------------------------

          test -f orbital-validation-checklist.json

          # --------------------------------------------------
          # Memory / audit / cockpit
          # --------------------------------------------------

          test -f js/memoryCore.js
          test -f js/auditCore.js
          test -f js/cockpit.js

          # --------------------------------------------------
          # Optional operator guidance
          # --------------------------------------------------

          if [ -f js/operatorGuidanceEngineV1.js ]; then
            echo "✔ OperatorGuidanceEngineV1 verified"
          else
            echo "ℹ OperatorGuidanceEngineV1 optional"
          fi

          echo "✔ Core HTML verified"
          echo "✔ Orbital modules verified"
          echo "✔ Manoeuvre modules verified"
          echo "✔ Failsafe modules verified"
          echo "✔ CommandCentreCoreV3 verified"
          echo "✔ Cascade Resilience Index verified"
          echo "✔ ValidationCoreV1 verified"
          echo "✔ ValidationChecklistV1 verified"
          echo "✔ validation-loader.js verified"
          echo "✔ orbital-validation-checklist.json verified"
          echo "✔ MemoryCoreV1 verified"
          echo "✔ AuditCoreV1 verified"


      # ======================================================
      # VALIDATION EVIDENCE FILE
      # ======================================================

      - name: "Validate orbital validation evidence"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "orbital-validation-checklist.json";

          if (!fs.existsSync(file)) {
            throw new Error(
              "orbital-validation-checklist.json missing"
            );
          }

          let data;

          try {
            data = JSON.parse(
              fs.readFileSync(file, "utf8")
            );
          } catch (error) {
            throw new Error(
              "orbital-validation-checklist.json is not valid JSON"
            );
          }

          const requiredTopLevel = [
            "framework",
            "validationVersion",
            "scenario",
            "domain",
            "checks",
            "finalStatus"
          ];

          for (const key of requiredTopLevel) {
            if (!(key in data)) {
              throw new Error(
                `Missing validation evidence field: ${key}`
              );
            }
          }

          if (
            data.framework !==
            "Sextant Orbital Resilience Framework"
          ) {
            throw new Error(
              "Unexpected validation framework"
            );
          }

          if (data.scenario !== "SIGNAL_LOSS") {
            throw new Error(
              "Expected SIGNAL_LOSS validation scenario"
            );
          }

          if (data.domain !== "ORBITAL") {
            throw new Error(
              "Expected ORBITAL validation domain"
            );
          }

          if (
            data.finalStatus !==
            "VALIDATION_COMPLETE"
          ) {
            throw new Error(
              "Validation evidence is not complete"
            );
          }

          console.log(
            "✔ Orbital validation evidence verified"
          );

          console.log(
            `✔ Scenario: ${data.scenario}`
          );

          console.log(
            `✔ Domain: ${data.domain}`
          );

          console.log(
            `✔ Final status: ${data.finalStatus}`
          );
          NODE


      # ======================================================
      # VALIDATION LOADER
      # ======================================================

      - name: "Validate validation loader"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "validation-loader.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "validation-loader.js missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "ValidationCoreV1",
            "orbital-validation-checklist"
          ];

          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {
              throw new Error(
                `Missing validation loader marker: ${marker}`
              );
            }

          }

          console.log(
            "✔ validation-loader.js verified"
          );

          console.log(
            "✔ ValidationCoreV1 integration marker detected"
          );

          console.log(
            "✔ Validation evidence supplied separately by orbital-validation-checklist.json"
          );
          NODE


      # ======================================================
      # VALIDATION CHECKLIST INTERFACE
      #
      # Structural validation only.
      #
      # Do NOT require exact visual text such as:
      # "Validation Checklist v1.1"
      #
      # The interface may legitimately be rendered dynamically.
      # ======================================================

      - name: "Validate checklist interface"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const candidates = [
            "validation-checklist.html",
            "orbital-validation-checklist.html",
            "validation-checklist/index.html",
            "index.html"
          ];

          let file = null;

          for (const candidate of candidates) {
            if (fs.existsSync(candidate)) {
              file = candidate;
              break;
            }
          }

          if (!file) {
            throw new Error(
              "No validation checklist interface HTML found"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const markers = [
            "validationStatus",
            "validationSummary"
          ];

          for (const marker of markers) {

            if (!source.includes(marker)) {
              throw new Error(
                `Missing checklist interface marker: ${marker}`
              );
            }

          }

          console.log(
            `✔ Checklist interface verified: ${file}`
          );

          console.log(
            "✔ validationStatus interface detected"
          );

          console.log(
            "✔ validationSummary interface detected"
          );
          NODE


      # ======================================================
      # VALIDATION CHECKLIST ENGINE
      # ======================================================

      - name: "Validate ValidationChecklistV1"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "js/validationChecklist.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "ValidationChecklistV1 file missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "ValidationChecklistV1",
            "VC-001",
            "VC-002",
            "VC-003",
            "VC-004",
            "VC-005",
            "VC-006",
            "VC-007",
            "VC-008",
            "VC-009",
            "VC-010",
            "VC-011",
            "VC-012",
            "VC-013",
            "VC-014",
            "runValidationChecklist",
            "verifyHumanDecisionGate",
            "renderValidationChecklist",
            "MISSION_CONTROLLER",
            "automaticExecution",
            "simulationOnly",
            "NO_RECOVERY_ACTION_EXECUTED_UNTIL_HUMAN_AUTHORIZATION"
          ];

          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {
              throw new Error(
                `Missing ValidationChecklistV1 marker: ${marker}`
              );
            }

          }

          console.log(
            "✔ ValidationChecklistV1 structure verified"
          );

          console.log(
            "✔ 14 validation controls detected"
          );

          console.log(
            "✔ Human Decision Authority verification detected"
          );

          console.log(
            "✔ Execution Gate verification detected"
          );

          console.log(
            "✔ MemoryCoreV1 traceability verification detected"
          );

          console.log(
            "✔ AuditCoreV1 traceability verification detected"
          );

          console.log(
            "✔ Simulation-only boundary detected"
          );
          NODE


      # ======================================================
      # COMMAND-CENTRE CORE VALIDATION
      # ======================================================

      - name: "Validate Command-Centre Core v3"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "commandCentreCoreV3.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "CommandCentreCoreV3 file missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "CommandCentreCoreV3",
            "COMMAND_CENTRE_RESILIENCE_CORE_V3",
            "SIMULATION_ONLY",
            "automaticExecution",
            "humanAuthorizationRequired",
            "liveSystemControl",
            "OBSERVE",
            "VERIFY",
            "ASSESS",
            "DECIDE",
            "FINAL_HUMAN_DECISION",
            "ACT",
            "UPDATE",
            "MISSION_CONTROLLER"
          ];

          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {
              throw new Error(
                `Missing CommandCentreCoreV3 marker: ${marker}`
              );
            }

          }

          console.log(
            "✔ CommandCentreCoreV3 structure verified"
          );

          console.log(
            "✔ Golden Rule pipeline verified"
          );

          console.log(
            "✔ Human authority boundary verified"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );
          NODE


      # ======================================================
      # CASCADE RESILIENCE INDEX VALIDATION
      # ======================================================

      - name: "Validate Cascade Resilience Index"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "cascade-resilience-index.html";

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cascade Resilience Index file missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "Sextant Cascade Resilience Index",
            "Command-Centre Core v3",
            "LOCAL_DISTURBANCE",
            "DEPENDENCY_FAILURE",
            "CASCADE_EVENT",
            "MULTI_NODE_FAILURE",
            "SYSTEMIC_STRESS",
            "AUTHORIZE_RECOVERY",
            "MAINTAIN_SAFE_STATE",
            "REQUEST_DIAGNOSTICS",
            "ABORT_RECOVERY",
            "ESCALATE",
            "HUMAN AUTHORIZATION",
            "SIMULATION ONLY",
            "LIVE SYSTEM CONTROL"
          ];

          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {
              throw new Error(
                `Missing CRI marker: ${marker}`
              );
            }

          }

          console.log(
            "✔ Cascade Resilience Index verified"
          );

          console.log(
            "✔ Scenario controls verified"
          );

          console.log(
            "✔ Human decision controls verified"
          );

          console.log(
            "✔ Simulation boundary verified"
          );
          NODE


      # ======================================================
      # ORBITAL ENGINE VALIDATION
      # ======================================================

      - name: "Run Orbital Failsafe Validation"
        run: |
          node <<'NODE'
          console.log(
            "🛰️ Sextant Orbital Validation"
          );

          const engines = [
            "OrbitalEngineV1",
            "ManoeuvreEngineV1",
            "FailsafeTransitionEngineV1",
            "CommandCentreCoreV3",
            "Cascade Resilience Index",
            "ValidationCoreV1",
            "ValidationChecklistV1",
            "MemoryCoreV1",
            "AuditCoreV1"
          ];

          for (const engine of engines) {
            console.log(`✔ ${engine}`);
          }

          console.log(
            "✔ Golden Rule Pipeline ACTIVE"
          );

          console.log(
            "✔ FINAL HUMAN DECISION gate ACTIVE"
          );

          console.log(
            "✔ Manoeuvre Engine Simulation Boundary ACTIVE"
          );

          console.log(
            "✔ Automatic Execution DISABLED"
          );

          console.log(
            "✔ Human Authorization REQUIRED"
          );

          console.log(
            "✔ Live System Control NOT CONNECTED"
          );
          NODE


      # ======================================================
      # COMMAND-CENTRE SAFETY VALIDATION
      # ======================================================

      - name: "Validate Command-Centre Safety Boundary"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const source =
            fs.readFileSync(
              "commandCentreCoreV3.js",
              "utf8"
            );

          const requiredMarkers = [
            "automaticExecution",
            "humanAuthorizationRequired",
            "liveSystemControl",
            "SIMULATION_ONLY",
            "FINAL_HUMAN_DECISION"
          ];

          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {
              throw new Error(
                `Safety marker missing: ${marker}`
              );
            }

          }

          const automaticExecutionDisabled =
            /automaticExecution\s*:\s*false/.test(source);

          const humanAuthorizationRequired =
            /humanAuthorizationRequired\s*:\s*true/.test(source);

          const liveSystemControlDisabled =
            /liveSystemControl\s*:\s*false/.test(source);

          if (!automaticExecutionDisabled) {
            throw new Error(
              "Automatic execution safety boundary failed"
            );
          }

          if (!humanAuthorizationRequired) {
            throw new Error(
              "Human authorization boundary failed"
            );
          }

          if (!liveSystemControlDisabled) {
            throw new Error(
              "Live system control boundary failed"
            );
          }

          console.log(
            "✔ Command-Centre safety boundary PASS"
          );

          console.log(
            "✔ Automatic execution = FALSE"
          );

          console.log(
            "✔ Human authorization = REQUIRED"
          );

          console.log(
            "✔ Live system control = FALSE"
          );

          console.log(
            "✔ Simulation-only boundary = ACTIVE"
          );
          NODE


      # ======================================================
      # RUNTIME SIMULATION OUTPUT
      # ======================================================

      - name: "Generate runtime output"
        run: |
          set -e

          mkdir -p docs/runtime

          python - <<'PY'
          import json
          from pathlib import Path

          result = {

              "framework":
                  "Sextant Orbital Resilience Framework v2.4",

              "validationVersion":
                  "1.0",

              "scenario":
                  "SIGNAL_LOSS",

              "domain":
                  "ORBITAL",

              "engine":
                  "OrbitalEngineV1",

              "commandCentre":
                  {
                      "engine":
                          "CommandCentreCoreV3",

                      "version":
                          "v3.0",

                      "status":
                          "READY",

                      "operatingMode":
                          "SIMULATION_ONLY",

                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "liveSystemControl":
                          False
                  },

              "cascadeResilienceIndex":
                  {
                      "status":
                          "READY",

                      "mode":
                          "DETERMINISTIC_SIMULATION",

                      "humanAuthority":
                          "REQUIRED"
                  },

              "manoeuvre":
                  {
                      "engine":
                          "ManoeuvreEngineV1",

                      "status":
                          "SIMULATION_COMPLETE",

                      "mode":
                          "ASSESSMENT_ONLY",

                      "courseChangeCapability":
                          "NOT_ACTIVE",

                      "collisionAvoidance":
                          "NOT_IMPLEMENTED",

                      "humanOperationalAuthority":
                          "REQUIRED"
                  },

              "failsafe":
                  {
                      "engine":
                          "FailsafeTransitionEngineV1",

                      "state":
                          "STABILIZED"
                  },

              "validation":
                  {
                      "status":
                          "PASS",

                      "validationChecklist":
                          "VALIDATION_COMPLETE"
                  },

              "memory":
                  {
                      "status":
                          "UPDATED"
                  },

              "audit":
                  {
                      "status":
                          "GENERATED"
                  },

              "authority":
                  "GOLDEN_RULE_ENGINE",

              "humanAuthority":
                  "MISSION_CONTROLLER",

              "pipeline":
                  [
                      "OBSERVE",
                      "VERIFY",
                      "ASSESS",
                      "DECIDE",
                      "FINAL_HUMAN_DECISION",
                      "ACT",
                      "UPDATE"
                  ],

              "safetyBoundary":
                  {
                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "simulationOnly":
                          True,

                      "liveSystemControl":
                          False
                  }
          }

          output = Path(
              "docs/runtime/orbital.json"
          )

          output.write_text(
              json.dumps(
                  result,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "✔ Runtime generated:",
              output
          )
          PY


      # ======================================================
      # VALIDATION CHECKLIST ARTIFACT
      # ======================================================

      - name: "Package validation evidence"
        run: |
          set -e

          mkdir -p docs/validation

          cp orbital-validation-checklist.json \
             docs/validation/orbital-validation-checklist.json

          cp validation-loader.js \
             docs/validation/validation-loader.js

          cp js/validationChecklist.js \
             docs/validation/validationChecklist.js

          echo "✔ Validation evidence packaged"

          test -f \
            docs/validation/orbital-validation-checklist.json

          test -f \
            docs/validation/validation-loader.js

          test -f \
            docs/validation/validationChecklist.js


      # ======================================================
      # GITHUB PAGES PACKAGE
      # ======================================================
      #
      # IMPORTANT:
      # Do NOT delete docs.
      #
      # Runtime and validation evidence already exist inside docs/.
      # ======================================================

      - name: "Build GitHub Pages package"
        run: |
          set -e

          mkdir -p docs

          cp index.html \
             docs/index.html

          cp cascade-resilience-index.html \
             docs/cascade-resilience-index.html

          cp commandCentreCoreV3.js \
             docs/commandCentreCoreV3.js

          if [ -d js ]; then
            rm -rf docs/js
            cp -r js docs/js
          fi

          # Preserve validation evidence.
          mkdir -p docs/validation

          cp orbital-validation-checklist.json \
             docs/validation/orbital-validation-checklist.json

          cp validation-loader.js \
             docs/validation/validation-loader.js

          cp js/validationChecklist.js \
             docs/validation/validationChecklist.js

          echo "✔ GitHub Pages package prepared"

          echo ""
          echo "📦 Pages package contents:"
          find docs -maxdepth 4 -type f | sort

          echo ""
          echo "📄 Runtime output:"
          test -f \
            docs/runtime/orbital.json

          echo "✔ docs/runtime/orbital.json verified"

          echo ""
          echo "📋 Validation evidence:"
          test -f \
            docs/validation/orbital-validation-checklist.json

          test -f \
            docs/validation/validation-loader.js

          test -f \
            docs/validation/validationChecklist.js

          echo "✔ Validation evidence verified"


      # ======================================================
      # FINAL ARTIFACT INTEGRITY CHECK
      # ======================================================

      - name: "Final artifact integrity validation"
        run: |
          set -e

          echo "Running final artifact integrity check..."

          test -f docs/index.html
          test -f docs/runtime/orbital.json
          test -f docs/validation/orbital-validation-checklist.json
          test -f docs/validation/validation-loader.js
          test -f docs/validation/validationChecklist.js

          node <<'NODE'
          const fs = require("fs");

          const file =
            "docs/runtime/orbital.json";

          const data =
            JSON.parse(
              fs.readFileSync(file, "utf8")
            );

          if (
            data.scenario !==
            "SIGNAL_LOSS"
          ) {
            throw new Error(
              "Runtime scenario integrity failed"
            );
          }

          if (
            data.domain !==
            "ORBITAL"
          ) {
            throw new Error(
              "Runtime domain integrity failed"
            );
          }

          if (
            data.safetyBoundary
              .automaticExecution !== false
          ) {
            throw new Error(
              "Automatic execution boundary failed"
            );
          }

          if (
            data.safetyBoundary
              .humanAuthorizationRequired !== true
          ) {
            throw new Error(
              "Human authorization boundary failed"
            );
          }

          if (
            data.safetyBoundary
              .simulationOnly !== true
          ) {
            throw new Error(
              "Simulation-only boundary failed"
            );
          }

          if (
            data.safetyBoundary
              .liveSystemControl !== false
          ) {
            throw new Error(
              "Live system control boundary failed"
            );
          }

          console.log(
            "✔ Runtime integrity PASS"
          );

          console.log(
            "✔ Safety boundary PASS"
          );

          console.log(
            "✔ SIGNAL_LOSS scenario PASS"
          );

          console.log(
            "✔ ORBITAL domain PASS"
          );
          NODE


      # ======================================================
      # PAGES ARTIFACT
      # ======================================================

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  # ============================================================
  # FEATURE BRANCH GOVERNANCE
  #
  # Feature branches stop here.
  #
  # They validate and produce an artifact.
  # They DO NOT enter the protected github-pages environment.
  # ============================================================

  feature-branch-confirmation:

    name: "Feature Branch Validation Confirmation"

    needs:
      - simulate

    if: github.ref != 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: "Confirm feature branch boundary"
        run: |
          echo "🛰️ Sextant feature-branch validation complete"
          echo "🌿 Branch: ${GITHUB_REF_NAME}"
          echo "🧠 Validation = PASS"
          echo "📦 Artifact = GENERATED"
          echo "👤 Human Decision Authority = REQUIRED"
          echo "🛡️ Automatic Execution = FALSE"
          echo "🔒 Live System Control = FALSE"
          echo "🧪 Simulation Only = TRUE"
          echo "🚫 GitHub Pages deployment = NOT EXECUTED"
          echo "✔ Feature branch remains VALIDATION + ARTIFACT ONLY"


  # ============================================================
  # DEPLOYMENT
  #
  # MAIN BRANCH ONLY.
  #
  # Feature branches NEVER enter github-pages.
  # ============================================================

  deploy:

    name: "Deploy Sextant Cockpit"

    needs:
      - simulate

    if: github.ref == 'refs/heads/main'

    runs-on:
      - ubuntu-latest

    permissions:

      contents: read

      pages: write

      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ======================================================
      # CONFIGURE GITHUB PAGES
      # ======================================================

      - name: "Setup Pages"
        uses: actions/configure-pages@v5


      # ======================================================
      # DEPLOY
      # ======================================================

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4


      # ======================================================
      # DEPLOYMENT CONFIRMATION
      # ======================================================

      - name: "Deployment confirmation"
        run: |
          echo "🛰️ Sextant Orbital Resilience Cockpit deployment complete"
          echo "🌐 GitHub Pages deployment executed from MAIN"
          echo "🧠 Validation = PASS"
          echo "👤 Human Decision Authority = REQUIRED"
          echo "🛡️ Automatic Execution = FALSE"
          echo "🔒 Live System Control = FALSE"
          echo "🧪 Simulation Only = TRUE"