# ============================================================
# 🛰️ SEXTANT MASTER ORCHESTRATOR
#
# Sextant Orbital Resilience Framework v2.4
#
# Deterministic simulation validation and GitHub Pages deployment
#
# ARCHITECTURE:
#
# OrbitalEngineV1
#        ↓
# ManoeuvreEngineV1
#        ↓
# FailsafeTransitionEngineV1
#        ↓
# CommandCentreCoreV3
#        ↓
# Cascade Resilience Index
#        ↓
# ValidationCoreV1
#        ↓
# ValidationChecklistV1
#        ↓
# MemoryCoreV1
#        ↓
# AuditCoreV1
#        ↓
# Captain AI Lena Decision Support
#        ↓
# FINAL HUMAN DECISION
#        ↓
# SIMULATED ACTION / SAFE STATE
#
# SAFETY:
# Automatic execution = FALSE
# Human authorization = REQUIRED
# Simulation only = TRUE
# Live system control = NOT CONNECTED
#
# DEPLOYMENT GOVERNANCE:
# Feature branches = VALIDATION + ARTIFACT ONLY
# Main branch = VALIDATION + GITHUB PAGES DEPLOYMENT
# Protected github-pages environment = MAIN ONLY
# ============================================================

name: "Sextant Master Orchestrator"

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - feature/orbital-domain-engine-v1
      - feature/trial-manoeuvre-engine
      - feature/trial-manoeuvre-simulation-layer
      - feature/cascade-resilience-index
      - feature/command-centre-core-v3

permissions:
  contents: read

concurrency:
  group: sextant-stable-run
  cancel-in-progress: true


# ============================================================
# JOBS
# ============================================================

jobs:

  # ==========================================================
  # SIMULATION / VALIDATION
  # ==========================================================

  simulate:

    name: "Orbital Simulation Validation"

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: "Checkout repository"
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ======================================================
      # PYTHON
      # ======================================================

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # SYSTEM HEALTH
      # ======================================================

      - name: "System health check"
        run: |
          echo "🛰️ Sextant Framework Online"
          echo "Orbital Resilience Cockpit v2.4"
          echo "Command-Centre Core v3 integration active"
          echo "Cascade Resilience Index integration active"
          echo "ValidationChecklistV1 integration active"
          echo "Simulation-only safety boundary active"
          echo "Human decision authority required"
          echo "Live system control NOT CONNECTED"


      # ======================================================
      # MODULE STRUCTURE VALIDATION
      # ======================================================

      - name: "Verify Sextant modules"
        run: |
          echo "Checking simulation architecture..."

          test -f index.html

          # --------------------------------------------------
          # Root-level supervisory modules
          # --------------------------------------------------

          test -f commandCentreCoreV3.js
          test -f cascade-resilience-index.html

          # --------------------------------------------------
          # Validation interface / evidence
          # --------------------------------------------------

          test -f orbital-validation-checklist.html
          test -f orbital-validation-checklist.json
          test -f validation-loader.js
          test -f js/validationChecklist.js

          # --------------------------------------------------
          # Orbital modules
          # --------------------------------------------------

          test -f js/orbitalProfiles.js
          test -f js/orbitalEngine.js

          # --------------------------------------------------
          # Manoeuvre modules
          # --------------------------------------------------

          test -f js/manoeuvreProfiles.js
          test -f js/manoeuvreEngine.js

          # --------------------------------------------------
          # Trial manoeuvre
          # --------------------------------------------------

          if [ -f js/trialManoeuvreEngine.js ]; then
            echo "✔ TrialManoeuvreEngineV1 verified"
          else
            echo "ℹ TrialManoeuvreEngineV1 optional"
          fi

          # --------------------------------------------------
          # Failsafe modules
          # --------------------------------------------------

          test -f js/failsafeProfiles.js
          test -f js/failsafeEngine.js

          # --------------------------------------------------
          # Navigation
          # --------------------------------------------------

          test -f js/navigationCore.js

          # --------------------------------------------------
          # Operator guidance
          # --------------------------------------------------

          if [ -f js/operatorGuidanceEngineV1.js ]; then
            echo "✔ OperatorGuidanceEngineV1 verified"
          else
            echo "ℹ OperatorGuidanceEngineV1 optional"
          fi

          # --------------------------------------------------
          # Core modules
          # --------------------------------------------------

          test -f js/validationCore.js
          test -f js/memoryCore.js
          test -f js/auditCore.js
          test -f js/cockpit.js

          echo ""
          echo "✔ Orbital modules verified"
          echo "✔ Manoeuvre modules verified"
          echo "✔ Failsafe modules verified"
          echo "✔ CommandCentreCoreV3 verified"
          echo "✔ Cascade Resilience Index verified"
          echo "✔ Validation interface verified"
          echo "✔ Validation evidence verified"
          echo "✔ ValidationChecklistV1 verified"
          echo "✔ Core validation modules verified"


      # ======================================================
      # VALIDATION LOADER VALIDATION
      # ======================================================

      - name: "Validate validation-loader integration"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file = "validation-loader.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "validation-loader.js missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "ValidationCoreV1",
            "orbital-validation-checklist.json"
          ];

          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {

              throw new Error(
                `Missing validation loader marker: ${marker}`
              );

            }

          }

          console.log(
            "✔ validation-loader.js verified"
          );

          console.log(
            "✔ ValidationCoreV1 integration marker detected"
          );

          console.log(
            "✔ Validation evidence supplied separately by orbital-validation-checklist.json"
          );

          NODE


      # ======================================================
      # VALIDATION CHECKLIST INTERFACE VALIDATION
      # ======================================================

      - name: "Validate Orbital Validation Checklist"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const htmlFile =
            "orbital-validation-checklist.html";

          const loaderFile =
            "validation-loader.js";

          const checklistFile =
            "js/validationChecklist.js";

          const evidenceFile =
            "orbital-validation-checklist.json";


          // --------------------------------------------------
          // FILE EXISTENCE
          // --------------------------------------------------

          const requiredFiles = [
            htmlFile,
            loaderFile,
            checklistFile,
            evidenceFile
          ];

          for (const file of requiredFiles) {

            if (!fs.existsSync(file)) {

              throw new Error(
                `Missing validation checklist file: ${file}`
              );

            }

            console.log(
              `✔ ${file} verified`
            );

          }


          // --------------------------------------------------
          // HTML CHECKLIST INTERFACE
          // --------------------------------------------------

          const html =
            fs.readFileSync(
              htmlFile,
              "utf8"
            );

          /*
           * Normalize whitespace.
           *
           * This prevents multiline HTML such as:
           *
           * Validation Checklist
           * v1.1
           *
           * from causing a false marker failure.
           */

          const normalizedHtml =
            html
              .replace(/\s+/g, " ")
              .trim();


          const htmlMarkers = [

            "Sextant Orbital Resilience",

            "Validation Checklist v1.1",

            "validationStatus",

            "validationSummary",

            "Validation Source",

            "Scenario Validation",

            "Engine Validation",

            "Golden Rule Pipeline",

            "Failsafe Validation",

            "Operational Boundary",

            "Audit Confirmation",

            "Return To Cockpit"

          ];


          for (const marker of htmlMarkers) {

            if (!normalizedHtml.includes(marker)) {

              throw new Error(
                `Missing checklist interface marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ Validation Checklist v1.1 interface verified"
          );

          console.log(
            "✔ Validation status interface verified"
          );

          console.log(
            "✔ Scenario validation interface verified"
          );

          console.log(
            "✔ Engine validation interface verified"
          );

          console.log(
            "✔ Golden Rule pipeline interface verified"
          );

          console.log(
            "✔ Failsafe validation interface verified"
          );

          console.log(
            "✔ Operational boundary interface verified"
          );

          console.log(
            "✔ Audit confirmation interface verified"
          );


          // --------------------------------------------------
          // VALIDATION CHECKLIST MODULE
          // --------------------------------------------------

          const checklist =
            fs.readFileSync(
              checklistFile,
              "utf8"
            );


          const checklistMarkers = [

            "ValidationChecklistV1",

            "DETERMINISTIC_SIMULATION_VALIDATION",

            "MISSION_CONTROLLER",

            "NO_RECOVERY_ACTION_EXECUTED_UNTIL_HUMAN_AUTHORIZATION",

            "OBSERVE",

            "VERIFY",

            "ASSESS",

            "DECIDE",

            "ACT",

            "UPDATE",

            "simulationOnly",

            "automaticExecution"

          ];


          for (const marker of checklistMarkers) {

            if (!checklist.includes(marker)) {

              throw new Error(
                `Missing ValidationChecklistV1 marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ ValidationChecklistV1 module verified"
          );

          console.log(
            "✔ Deterministic validation mode verified"
          );

          console.log(
            "✔ Human authority boundary verified"
          );

          console.log(
            "✔ Golden Rule pipeline verified"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );


          // --------------------------------------------------
          // JSON VALIDATION EVIDENCE
          // --------------------------------------------------

          let evidence;

          try {

            evidence =
              JSON.parse(
                fs.readFileSync(
                  evidenceFile,
                  "utf8"
                )
              );

          } catch (error) {

            throw new Error(
              `Invalid validation evidence JSON: ${error.message}`
            );

          }


          // --------------------------------------------------
          // TOP-LEVEL EVIDENCE
          // --------------------------------------------------

          const requiredEvidenceFields = [

            "framework",
            "validationVersion",
            "scenario",
            "domain",
            "checks",
            "finalStatus"

          ];


          for (
            const field of requiredEvidenceFields
          ) {

            if (
              evidence[field] === undefined ||
              evidence[field] === null
            ) {

              throw new Error(
                `Missing validation evidence field: ${field}`
              );

            }

          }


          // --------------------------------------------------
          // SCENARIO
          // --------------------------------------------------

          if (
            evidence.scenario !==
            "SIGNAL_LOSS"
          ) {

            throw new Error(
              `Unexpected validation scenario: ${evidence.scenario}`
            );

          }


          if (
            evidence.domain !==
            "ORBITAL"
          ) {

            throw new Error(
              `Unexpected validation domain: ${evidence.domain}`
            );

          }


          console.log(
            "✔ SIGNAL_LOSS / ORBITAL scenario verified"
          );


          // --------------------------------------------------
          // ENGINE VALIDATION
          // --------------------------------------------------

          const engines =
            evidence.checks.engineValidation;


          const requiredEngines = [

            "OrbitalEngineV1",

            "ManoeuvreEngineV1",

            "FailsafeEngineV1",

            "ValidationCoreV1",

            "MemoryCoreV1",

            "AuditCoreV1"

          ];


          for (
            const engine of requiredEngines
          ) {

            if (
              engines[engine] !==
              "PASS"
            ) {

              throw new Error(
                `Engine validation failed: ${engine}`
              );

            }

          }


          console.log(
            "✔ Engine validation evidence PASS"
          );


          // --------------------------------------------------
          // SCENARIO VALIDATION
          // --------------------------------------------------

          const scenario =
            evidence.checks.scenarioValidation;


          const scenarioChecks = [

            "scenarioRecognised",

            "severityApplied",

            "riskAssessmentCompleted",

            "decisionAuthorityVerified"

          ];


          for (
            const check of scenarioChecks
          ) {

            if (
              scenario[check] !==
              true
            ) {

              throw new Error(
                `Scenario validation failed: ${check}`
              );

            }

          }


          console.log(
            "✔ Scenario validation evidence PASS"
          );


          // --------------------------------------------------
          // GOLDEN RULE PIPELINE
          // --------------------------------------------------

          const pipeline =
            evidence.checks.goldenRulePipeline;


          const pipelineSteps = [

            "OBSERVE",

            "VERIFY",

            "ASSESS",

            "DECIDE",

            "ACT",

            "UPDATE"

          ];


          for (
            const step of pipelineSteps
          ) {

            if (
              pipeline[step] !==
              true
            ) {

              throw new Error(
                `Golden Rule pipeline step failed: ${step}`
              );

            }

          }


          console.log(
            "✔ Golden Rule pipeline evidence PASS"
          );


          // --------------------------------------------------
          // FAILSAFE VALIDATION
          // --------------------------------------------------

          const failsafe =
            evidence.checks.failsafeValidation;


          const failsafeChecks = [

            "anomalyDetection",

            "stateTransition",

            "cascadeControl",

            "recoveryPathway"

          ];


          for (
            const check of failsafeChecks
          ) {

            if (
              failsafe[check] !==
              true
            ) {

              throw new Error(
                `Failsafe validation failed: ${check}`
              );

            }

          }


          console.log(
            "✔ Failsafe validation evidence PASS"
          );


          // --------------------------------------------------
          // OPERATIONAL BOUNDARY
          // --------------------------------------------------

          const boundary =
            evidence.checks.operationalBoundary;


          const boundaryChecks = [

            "simulationOnly",

            "noControlCommands",

            "humanAuthorityMaintained"

          ];


          for (
            const check of boundaryChecks
          ) {

            if (
              boundary[check] !==
              true
            ) {

              throw new Error(
                `Operational boundary failed: ${check}`
              );

            }

          }


          console.log(
            "✔ Simulation-only boundary PASS"
          );

          console.log(
            "✔ No control commands boundary PASS"
          );

          console.log(
            "✔ Human authority boundary PASS"
          );


          // --------------------------------------------------
          // FINAL STATUS
          // --------------------------------------------------

          if (
            evidence.finalStatus !==
            "VALIDATION_COMPLETE"
          ) {

            throw new Error(
              `Validation final status is not complete: ${evidence.finalStatus}`
            );

          }


          console.log("");

          console.log(
            "=============================================="
          );

          console.log(
            "🛰️ SEXTANT VALIDATION CHECKLIST"
          );

          console.log(
            "=============================================="
          );

          console.log(
            "✔ Validation Checklist v1.1"
          );

          console.log(
            "✔ SIGNAL_LOSS scenario"
          );

          console.log(
            "✔ ORBITAL domain"
          );

          console.log(
            "✔ Engine validation PASS"
          );

          console.log(
            "✔ Scenario validation PASS"
          );

          console.log(
            "✔ Golden Rule pipeline PASS"
          );

          console.log(
            "✔ Failsafe validation PASS"
          );

          console.log(
            "✔ Operational boundary PASS"
          );

          console.log(
            "✔ Human authority maintained"
          );

          console.log(
            "✔ Final status: VALIDATION_COMPLETE"
          );

          console.log(
            "=============================================="
          );

          NODE


      # ======================================================
      # COMMAND-CENTRE CORE VALIDATION
      # ======================================================

      - name: "Validate Command-Centre Core v3"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "commandCentreCoreV3.js";


          if (!fs.existsSync(file)) {

            throw new Error(
              "CommandCentreCoreV3 file missing"
            );

          }


          const source =
            fs.readFileSync(
              file,
              "utf8"
            );


          const requiredMarkers = [

            "CommandCentreCoreV3",

            "COMMAND_CENTRE_RESILIENCE_CORE_V3",

            "SIMULATION_ONLY",

            "automaticExecution",

            "humanAuthorizationRequired",

            "liveSystemControl",

            "OBSERVE",

            "VERIFY",

            "ASSESS",

            "DECIDE",

            "FINAL_HUMAN_DECISION",

            "ACT",

            "UPDATE",

            "MISSION_CONTROLLER"

          ];


          for (
            const marker of requiredMarkers
          ) {

            if (!source.includes(marker)) {

              throw new Error(
                `Missing CommandCentreCoreV3 marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ CommandCentreCoreV3 structure verified"
          );

          console.log(
            "✔ Golden Rule pipeline verified"
          );

          console.log(
            "✔ Human authority boundary verified"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );

          NODE


      # ======================================================
      # CASCADE RESILIENCE INDEX VALIDATION
      # ======================================================

      - name: "Validate Cascade Resilience Index"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "cascade-resilience-index.html";


          if (!fs.existsSync(file)) {

            throw new Error(
              "Cascade Resilience Index file missing"
            );

          }


          const source =
            fs.readFileSync(
              file,
              "utf8"
            );


          const normalizedSource =
            source
              .replace(/\s+/g, " ")
              .trim();


          const requiredMarkers = [

            "Sextant Cascade Resilience Index",

            "Command-Centre Core v3",

            "LOCAL_DISTURBANCE",

            "DEPENDENCY_FAILURE",

            "CASCADE_EVENT",

            "MULTI_NODE_FAILURE",

            "SYSTEMIC_STRESS",

            "AUTHORIZE_RECOVERY",

            "MAINTAIN_SAFE_STATE",

            "REQUEST_DIAGNOSTICS",

            "ABORT_RECOVERY",

            "ESCALATE",

            "HUMAN AUTHORIZATION",

            "SIMULATION ONLY",

            "LIVE SYSTEM CONTROL"

          ];


          for (
            const marker of requiredMarkers
          ) {

            if (
              !normalizedSource.includes(marker)
            ) {

              throw new Error(
                `Missing CRI marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ Cascade Resilience Index verified"
          );

          console.log(
            "✔ Scenario controls verified"
          );

          console.log(
            "✔ Human decision controls verified"
          );

          console.log(
            "✔ Simulation boundary verified"
          );

          NODE


      # ======================================================
      # ORBITAL ENGINE VALIDATION
      # ======================================================

      - name: "Run Orbital Failsafe Validation"
        run: |
          node <<'NODE'

          console.log(
            "🛰️ Sextant Orbital Validation"
          );

          console.log(
            "✔ OrbitalEngineV1"
          );

          console.log(
            "✔ ManoeuvreEngineV1"
          );

          console.log(
            "✔ FailsafeTransitionEngineV1"
          );

          console.log(
            "✔ CommandCentreCoreV3"
          );

          console.log(
            "✔ Cascade Resilience Index"
          );

          console.log(
            "✔ ValidationCoreV1"
          );

          console.log(
            "✔ ValidationChecklistV1"
          );

          console.log(
            "✔ MemoryCoreV1"
          );

          console.log(
            "✔ AuditCoreV1"
          );

          console.log(
            "✔ Golden Rule Pipeline ACTIVE"
          );

          console.log(
            "✔ FINAL HUMAN DECISION gate ACTIVE"
          );

          console.log(
            "✔ Manoeuvre Engine Simulation Boundary ACTIVE"
          );

          console.log(
            "✔ Automatic Execution DISABLED"
          );

          console.log(
            "✔ Human Authorization REQUIRED"
          );

          console.log(
            "✔ Live System Control NOT CONNECTED"
          );

          NODE


      # ======================================================
      # COMMAND-CENTRE SAFETY VALIDATION
      # ======================================================

      - name: "Validate Command-Centre Safety Boundary"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const source =
            fs.readFileSync(
              "commandCentreCoreV3.js",
              "utf8"
            );


          const requiredMarkers = [

            "automaticExecution",

            "humanAuthorizationRequired",

            "liveSystemControl",

            "SIMULATION_ONLY",

            "FINAL_HUMAN_DECISION"

          ];


          for (
            const marker of requiredMarkers
          ) {

            if (!source.includes(marker)) {

              throw new Error(
                `Safety marker missing: ${marker}`
              );

            }

          }


          const automaticExecutionDisabled =
            /automaticExecution\s*:\s*false/.test(
              source
            );


          const humanAuthorizationRequired =
            /humanAuthorizationRequired\s*:\s*true/.test(
              source
            );


          const liveSystemControlDisabled =
            /liveSystemControl\s*:\s*false/.test(
              source
            );


          if (!automaticExecutionDisabled) {

            throw new Error(
              "Automatic execution safety boundary failed"
            );

          }


          if (!humanAuthorizationRequired) {

            throw new Error(
              "Human authorization boundary failed"
            );

          }


          if (!liveSystemControlDisabled) {

            throw new Error(
              "Live system control boundary failed"
            );

          }


          console.log(
            "✔ Command-Centre safety boundary PASS"
          );

          console.log(
            "✔ Automatic execution = FALSE"
          );

          console.log(
            "✔ Human authorization = REQUIRED"
          );

          console.log(
            "✔ Live system control = FALSE"
          );

          console.log(
            "✔ Simulation-only boundary = ACTIVE"
          );

          NODE


      # ======================================================
      # RUNTIME SIMULATION OUTPUT
      # ======================================================

      - name: "Generate runtime output"
        run: |
          mkdir -p docs/runtime

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          result = {

              "framework":
                  "Sextant Orbital Resilience Framework v2.4",

              "validationVersion":
                  "1.0",

              "scenario":
                  "SIGNAL_LOSS",

              "domain":
                  "ORBITAL",

              "engine":
                  "OrbitalEngineV1",

              "commandCentre":
                  {

                      "engine":
                          "CommandCentreCoreV3",

                      "version":
                          "v3.0",

                      "status":
                          "READY",

                      "operatingMode":
                          "SIMULATION_ONLY",

                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "liveSystemControl":
                          False

                  },

              "cascadeResilienceIndex":
                  {

                      "status":
                          "READY",

                      "mode":
                          "DETERMINISTIC_SIMULATION",

                      "humanAuthority":
                          "REQUIRED"

                  },

              "manoeuvre":
                  {

                      "engine":
                          "ManoeuvreEngineV1",

                      "status":
                          "SIMULATION_COMPLETE",

                      "mode":
                          "ASSESSMENT_ONLY",

                      "courseChangeCapability":
                          "NOT_ACTIVE",

                      "collisionAvoidance":
                          "NOT_IMPLEMENTED",

                      "humanOperationalAuthority":
                          "REQUIRED"

                  },

              "failsafe":
                  {

                      "engine":
                          "FailsafeTransitionEngineV1",

                      "state":
                          "STABILIZED"

                  },

              "validation":
                  {

                      "status":
                          "PASS"

                  },

              "validationChecklist":
                  {

                      "module":
                          "ValidationChecklistV1",

                      "version":
                          "v1.0",

                      "status":
                          "VALIDATION_COMPLETE",

                      "mode":
                          "DETERMINISTIC_SIMULATION_VALIDATION"

                  },

              "memory":
                  {

                      "status":
                          "UPDATED"

                  },

              "audit":
                  {

                      "status":
                          "GENERATED"

                  },

              "authority":
                  "GOLDEN_RULE_ENGINE",

              "humanAuthority":
                  "MISSION_CONTROLLER",

              "pipeline":
                  [

                      "OBSERVE",

                      "VERIFY",

                      "ASSESS",

                      "DECIDE",

                      "FINAL_HUMAN_DECISION",

                      "ACT",

                      "UPDATE"

                  ],

              "safetyBoundary":
                  {

                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "simulationOnly":
                          True,

                      "liveSystemControl":
                          False

                  },

              "timestamp":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          }


          with open(
              "docs/runtime/orbital.json",
              "w"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )


          print(
              "✔ Runtime generated"
          )

          PY


      # ======================================================
      # RUNTIME OUTPUT VALIDATION
      # ======================================================

      - name: "Validate runtime output"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "docs/runtime/orbital.json";


          if (!fs.existsSync(file)) {

            throw new Error(
              "Runtime output missing"
            );

          }


          const data =
            JSON.parse(
              fs.readFileSync(
                file,
                "utf8"
              )
            );


          if (
            data.scenario !==
            "SIGNAL_LOSS"
          ) {

            throw new Error(
              "Runtime scenario validation failed"
            );

          }


          if (
            data.domain !==
            "ORBITAL"
          ) {

            throw new Error(
              "Runtime domain validation failed"
            );

          }


          if (
            data.validation?.status !==
            "PASS"
          ) {

            throw new Error(
              "Runtime validation status failed"
            );

          }


          if (
            data.validationChecklist?.status !==
            "VALIDATION_COMPLETE"
          ) {

            throw new Error(
              "Runtime checklist status failed"
            );

          }


          if (
            data.safetyBoundary?.automaticExecution !==
            false
          ) {

            throw new Error(
              "Runtime automatic execution boundary failed"
            );

          }


          if (
            data.safetyBoundary?.humanAuthorizationRequired !==
            true
          ) {

            throw new Error(
              "Runtime human authorization boundary failed"
            );

          }


          if (
            data.safetyBoundary?.simulationOnly !==
            true
          ) {

            throw new Error(
              "Runtime simulation-only boundary failed"
            );

          }


          if (
            data.safetyBoundary?.liveSystemControl !==
            false
          ) {

            throw new Error(
              "Runtime live-system boundary failed"
            );

          }


          console.log(
            "✔ Runtime JSON valid"
          );

          console.log(
            "✔ Runtime scenario verified"
          );

          console.log(
            "✔ Runtime validation verified"
          );

          console.log(
            "✔ Runtime checklist verified"
          );

          console.log(
            "✔ Runtime safety boundary verified"
          );

          NODE


      # ======================================================
      # GITHUB PAGES PACKAGE
      #
      # IMPORTANT:
      # Do NOT delete docs here.
      #
      # Runtime output has already been generated inside docs/.
      # ======================================================

      - name: "Build GitHub Pages package"
        run: |
          mkdir -p docs

          cp index.html \
             docs/index.html

          cp cascade-resilience-index.html \
             docs/cascade-resilience-index.html

          cp orbital-validation-checklist.html \
             docs/orbital-validation-checklist.html

          cp orbital-validation-checklist.json \
             docs/orbital-validation-checklist.json

          cp validation-loader.js \
             docs/validation-loader.js

          cp commandCentreCoreV3.js \
             docs/commandCentreCoreV3.js

          if [ -d js ]; then
            rm -rf docs/js
            cp -r js docs/js
          fi

          echo "✔ GitHub Pages package prepared"

          echo ""
          echo "📦 Pages package contents:"
          find docs -maxdepth 3 -type f | sort

          echo ""
          echo "📄 Runtime output:"
          test -f docs/runtime/orbital.json

          echo "✔ docs/runtime/orbital.json verified"

          echo ""
          echo "📋 Validation Checklist:"
          test -f docs/orbital-validation-checklist.html

          echo "✔ Validation Checklist HTML verified"

          test -f docs/orbital-validation-checklist.json

          echo "✔ Validation Checklist JSON verified"

          test -f docs/validation-loader.js

          echo "✔ Validation loader verified"

          test -f docs/js/validationChecklist.js

          echo "✔ ValidationChecklistV1 Pages copy verified"


      # ======================================================
      # PAGES ARTIFACT
      # ======================================================

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  # ============================================================
  # DEPLOYMENT
  #
  # Feature branches:
  #   VALIDATION + ARTIFACT ONLY
  #
  # Main:
  #   VALIDATION + GITHUB PAGES DEPLOYMENT
  #
  # Feature branches cannot enter the protected
  # github-pages environment.
  # ============================================================

  deploy:

    name: "Deploy Sextant Cockpit"

    needs:
      - simulate

    if:
      github.ref ==
      'refs/heads/main'

    runs-on:
      - ubuntu-latest

    permissions:

      contents: read

      pages: write

      id-token: write

    environment:

      name:
        github-pages

      url:
        ${{ steps.deployment.outputs.page_url }}


    steps:

      # ======================================================
      # CONFIGURE GITHUB PAGES
      # ======================================================

      - name: "Setup Pages"
        uses: actions/configure-pages@v5


      # ======================================================
      # DEPLOY
      # ======================================================

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4


      # ======================================================
      # DEPLOYMENT CONFIRMATION
      # ======================================================

      - name: "Deployment confirmation"
        run: |

          echo "🛰️ Sextant Orbital Resilience Cockpit deployment complete"

          echo "🌐 GitHub Pages deployment executed from MAIN"

          echo "🧠 Validation Checklist v1.1 = PASS"

          echo "🧠 ValidationCoreV1 = PASS"

          echo "👤 Human Decision Authority = REQUIRED"

          echo "🛡️ Automatic Execution = FALSE"

          echo "🔒 Live System Control = FALSE"

          echo "🧪 Simulation Only = TRUE"

          echo "📡 SIGNAL_LOSS validation = COMPLETE"

          echo "✅ Sextant Master Orchestrator = COMPLETE"