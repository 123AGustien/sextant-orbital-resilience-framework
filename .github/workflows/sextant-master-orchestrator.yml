name: "Sextant JavaScript Syntax Diagnostic"

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  javascript-syntax:

    name: "Find JavaScript Syntax Error"

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: "Checkout repository"
        uses: actions/checkout@v4


      # ======================================================
      # NODE
      # ======================================================

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ======================================================
      # JAVASCRIPT SYNTAX DIAGNOSTIC
      #
      # Finds every JavaScript file in the repository.
      #
      # IMPORTANT:
      # This does NOT assume filenames.
      # It reports the exact file that fails.
      # ======================================================

      - name: "Find JavaScript syntax error"
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "🛰️ SEXTANT JAVASCRIPT SYNTAX DIAGNOSTIC"
          echo "========================================"
          echo ""

          FOUND=0
          FAILED=0

          while IFS= read -r file
          do

            FOUND=1

            echo "----------------------------------------"
            echo "Checking: $file"
            echo "----------------------------------------"

            if node --check "$file"; then

              echo "✔ SYNTAX PASS: $file"
              echo ""

            else

              echo ""
              echo "❌ SYNTAX ERROR FOUND"
              echo "File: $file"
              echo ""
              echo "Workflow stopped at the first failing file."
              echo ""

              FAILED=1
              break

            fi

          done < <(
            find . \
              -type f \
              -name "*.js" \
              -not -path "./node_modules/*" \
              -not -path "./.git/*" \
              -print \
              | sort
          )


          # ==================================================
          # NO JAVASCRIPT FILES
          # ==================================================

          if [ "$FOUND" -eq 0 ]; then

            echo "❌ No JavaScript files found."

            exit 1

          fi


          # ==================================================
          # FAILURE
          # ==================================================

          if [ "$FAILED" -eq 1 ]; then

            echo ""
            echo "========================================"
            echo "❌ JAVASCRIPT SYNTAX VALIDATION FAILED"
            echo "========================================"

            exit 1

          fi


          # ==================================================
          # SUCCESS
          # ==================================================

          echo ""
          echo "========================================"
          echo "✔ JAVASCRIPT SYNTAX VALIDATION PASS"
          echo "========================================"
          echo ""

          echo "✔ All discovered JavaScript files passed"
          echo "✔ No syntax errors detected"
          echo "✔ Repository JavaScript syntax is valid"