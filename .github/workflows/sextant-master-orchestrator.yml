# ============================================================
# 🛰️ SEXTANT MASTER ORCHESTRATOR
#
# Sextant Orbital Resilience Framework v2.4
#
# Deterministic simulation validation and GitHub Pages deployment
#
# ARCHITECTURE:
#
# OrbitalEngineV1
#        ↓
# ManoeuvreEngineV1
#        ↓
# FailsafeTransitionEngineV1
#        ↓
# CommandCentreCoreV3
#        ↓
# Cascade Resilience Index
#        ↓
# ValidationCoreV1
#        ↓
# ValidationChecklistV1
#        ↓
# MemoryCoreV1
#        ↓
# AuditCoreV1
#        ↓
# Captain AI Lena Decision Support
#        ↓
# FINAL HUMAN DECISION
#        ↓
# SIMULATED ACTION / SAFE STATE
#
# SAFETY:
# Automatic execution = FALSE
# Human authorization = REQUIRED
# Simulation only = TRUE
# Live system control = NOT CONNECTED
#
# DEPLOYMENT GOVERNANCE:
# Feature branches = VALIDATION + ARTIFACT ONLY
# Main branch = VALIDATION + GITHUB PAGES DEPLOYMENT
# Protected github-pages environment = MAIN ONLY
# ============================================================

name: "Sextant Master Orchestrator"

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - feature/orbital-domain-engine-v1
      - feature/trial-manoeuvre-engine
      - feature/trial-manoeuvre-simulation-layer
      - feature/cascade-resilience-index
      - feature/command-centre-core-v3

permissions:
  contents: read

concurrency:
  group: sextant-stable-run
  cancel-in-progress: true


# ============================================================
# SIMULATION / VALIDATION
# ============================================================

jobs:

  simulate:

    name: "Orbital Simulation Validation"

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: "Checkout repository"
        uses: actions/checkout@v4

      # ======================================================
      # NODE
      # ======================================================

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ======================================================
      # PYTHON
      # ======================================================

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # SYSTEM HEALTH
      # ======================================================

      - name: "System health check"
        run: |
          echo "🛰️ Sextant Framework Online"
          echo "Orbital Resilience Cockpit v2.4"
          echo "Command-Centre Core v3 integration active"
          echo "Cascade Resilience Index integration active"
          echo "ValidationChecklistV1 integration active"
          echo "Simulation-only safety boundary active"
          echo "Human decision authority required"
          echo "Live system control NOT CONNECTED"

      # ======================================================
      # MODULE STRUCTURE VALIDATION
      # ======================================================

      - name: "Verify Sextant modules"
        run: |
          echo "Checking simulation architecture..."

          test -f index.html

          # --------------------------------------------------
          # Root-level supervisory modules
          # --------------------------------------------------

          test -f commandCentreCoreV3.js
          test -f cascade-resilience-index.html

          # --------------------------------------------------
          # Orbital modules
          # --------------------------------------------------

          test -f js/orbitalProfiles.js
          test -f js/orbitalEngine.js

          # --------------------------------------------------
          # Manoeuvre modules
          # --------------------------------------------------

          test -f js/manoeuvreProfiles.js
          test -f js/manoeuvreEngine.js

          # --------------------------------------------------
          # Failsafe modules
          # --------------------------------------------------

          test -f js/failsafeProfiles.js
          test -f js/failsafeEngine.js

          # --------------------------------------------------
          # Navigation
          # --------------------------------------------------

          test -f js/navigationCore.js

          # --------------------------------------------------
          # Operator guidance
          # --------------------------------------------------

          if [ -f js/operatorGuidanceEngineV1.js ]; then
            echo "✔ OperatorGuidanceEngineV1 verified"
          else
            echo "ℹ OperatorGuidanceEngineV1 optional"
          fi

          # --------------------------------------------------
          # Core modules
          # --------------------------------------------------

          test -f js/validationCore.js
          test -f js/memoryCore.js
          test -f js/auditCore.js
          test -f js/cockpit.js

          # --------------------------------------------------
          # Validation evidence layer
          # --------------------------------------------------

          test -f js/validationChecklist.js

          # --------------------------------------------------
          # Validation interface / evidence
          # --------------------------------------------------

          test -f validation-loader.js
          test -f orbital-validation-checklist.html
          test -f orbital-validation-checklist.json

          echo "✔ Orbital modules verified"
          echo "✔ Manoeuvre modules verified"
          echo "✔ Failsafe modules verified"
          echo "✔ Navigation module verified"
          echo "✔ CommandCentreCoreV3 verified"
          echo "✔ Cascade Resilience Index verified"
          echo "✔ Core validation modules verified"
          echo "✔ ValidationChecklistV1 verified"
          echo "✔ Validation loader verified"
          echo "✔ Validation checklist interface verified"
          echo "✔ Validation evidence JSON verified"

      # ======================================================
      # VALIDATE VALIDATION EVIDENCE JSON
      # ======================================================

      - name: "Validate orbital validation evidence"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "orbital-validation-checklist.json";

          if (!fs.existsSync(file)) {
            throw new Error(
              "orbital-validation-checklist.json missing"
            );
          }

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          const requiredRootFields = [
            "framework",
            "validationVersion",
            "scenario",
            "domain",
            "checks",
            "finalStatus"
          ];

          for (const field of requiredRootFields) {
            if (!(field in data)) {
              throw new Error(
                `Missing validation evidence field: ${field}`
              );
            }
          }

          if (
            data.scenario !== "SIGNAL_LOSS"
          ) {
            throw new Error(
              "Validation scenario must be SIGNAL_LOSS"
            );
          }

          if (
            data.domain !== "ORBITAL"
          ) {
            throw new Error(
              "Validation domain must be ORBITAL"
            );
          }

          if (
            data.finalStatus !== "VALIDATION_COMPLETE"
          ) {
            throw new Error(
              "Validation evidence final status is not VALIDATION_COMPLETE"
            );
          }

          const engineValidation =
            data.checks.engineValidation;

          const requiredEngines = [
            "OrbitalEngineV1",
            "ManoeuvreEngineV1",
            "FailsafeEngineV1",
            "ValidationCoreV1",
            "MemoryCoreV1",
            "AuditCoreV1"
          ];

          for (const engine of requiredEngines) {
            if (
              engineValidation?.[engine] !== "PASS"
            ) {
              throw new Error(
                `Engine validation failed: ${engine}`
              );
            }
          }

          const pipeline =
            data.checks.goldenRulePipeline;

          const requiredPipeline = [
            "OBSERVE",
            "VERIFY",
            "ASSESS",
            "DECIDE",
            "ACT",
            "UPDATE"
          ];

          for (const step of requiredPipeline) {
            if (pipeline?.[step] !== true) {
              throw new Error(
                `Golden Rule pipeline step failed: ${step}`
              );
            }
          }

          const boundary =
            data.checks.operationalBoundary;

          if (boundary?.simulationOnly !== true) {
            throw new Error(
              "Simulation-only boundary failed"
            );
          }

          if (boundary?.noControlCommands !== true) {
            throw new Error(
              "No-control-command boundary failed"
            );
          }

          if (boundary?.humanAuthorityMaintained !== true) {
            throw new Error(
              "Human authority boundary failed"
            );
          }

          console.log(
            "✔ orbital-validation-checklist.json verified"
          );

          console.log(
            "✔ SIGNAL_LOSS validation evidence verified"
          );

          console.log(
            "✔ Engine validation evidence verified"
          );

          console.log(
            "✔ Golden Rule pipeline evidence verified"
          );

          console.log(
            "✔ Operational boundary evidence verified"
          );

          console.log(
            "✔ Final validation status = VALIDATION_COMPLETE"
          );
          NODE

      # ======================================================
      # VALIDATION LOADER VALIDATION
      # ======================================================

      - name: "Validate validation loader"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "validation-loader.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "validation-loader.js missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "ValidationCoreV1",
            "orbital-validation-checklist"
          ];

          for (const marker of requiredMarkers) {
            if (!source.includes(marker)) {
              throw new Error(
                `Missing validation loader marker: ${marker}`
              );
            }
          }

          console.log(
            "✔ validation-loader.js verified"
          );

          console.log(
            "✔ ValidationCoreV1 integration marker detected"
          );

          console.log(
            "✔ Validation evidence supplied separately by orbital-validation-checklist.json"
          );
          NODE

      # ======================================================
      # VALIDATION CHECKLIST MODULE VALIDATION
      # ======================================================

      - name: "Validate ValidationChecklistV1"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "js/validationChecklist.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "js/validationChecklist.js missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "ValidationChecklistV1",
            "VC-001",
            "VC-002",
            "VC-003",
            "VC-004",
            "VC-005",
            "VC-006",
            "VC-007",
            "VC-008",
            "VC-009",
            "VC-010",
            "VC-011",
            "VC-012",
            "VC-013",
            "VC-014",
            "MISSION_CONTROLLER",
            "SIMULATION_ONLY",
            "NO_RECOVERY_ACTION_EXECUTED_UNTIL_HUMAN_AUTHORIZATION",
            "automaticExecution",
            "validationChecklist"
          ];

          for (const marker of requiredMarkers) {
            if (!source.includes(marker)) {
              throw new Error(
                `Missing ValidationChecklistV1 marker: ${marker}`
              );
            }
          }

          console.log(
            "✔ ValidationChecklistV1 structure verified"
          );

          console.log(
            "✔ VC-001 through VC-014 verified"
          );

          console.log(
            "✔ Human decision authority verification present"
          );

          console.log(
            "✔ Execution gate verification present"
          );

          console.log(
            "✔ Memory and audit verification present"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );
          NODE

      # ======================================================
      # VALIDATION CHECKLIST INTERFACE VALIDATION
      # ======================================================

      - name: "Validate orbital checklist interface"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "orbital-validation-checklist.html";

          if (!fs.existsSync(file)) {
            throw new Error(
              "orbital-validation-checklist.html missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const titleMarkers = [
            "Sextant Orbital Validation Checklist v1.1",
            "Validation Checklist v1.1"
          ];

          const hasTitle =
            titleMarkers.some(
              marker => source.includes(marker)
            );

          if (!hasTitle) {
            throw new Error(
              "Missing checklist interface title marker"
            );
          }

          const requiredMarkers = [
            "validationStatus",
            "validationSummary",
            "Validation Source",
            "Scenario Validation",
            "Engine Validation",
            "Golden Rule Pipeline",
            "Failsafe Validation",
            "Operational Boundary",
            "Audit Confirmation",
            "validation-loader.js",
            "orbital-validation-checklist.json",
            "ValidationCoreV1",
            "SIGNAL_LOSS",
            "ORBITAL",
            "SIMULATION ONLY",
            "FINAL STATUS: VALIDATION COMPLETE"
          ];

          for (const marker of requiredMarkers) {
            if (!source.includes(marker)) {
              throw new Error(
                `Missing checklist interface marker: ${marker}`
              );
            }
          }

          console.log(
            "✔ Orbital validation checklist interface verified"
          );

          console.log(
            "✔ Validation Checklist v1.1 marker verified"
          );

          console.log(
            "✔ SIGNAL_LOSS scenario interface verified"
          );

          console.log(
            "✔ Validation source interface verified"
          );

          console.log(
            "✔ Operational boundary interface verified"
          );
          NODE

      # ======================================================
      # COMMAND-CENTRE CORE VALIDATION
      # ======================================================

      - name: "Validate Command-Centre Core v3"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "commandCentreCoreV3.js";

          if (!fs.existsSync(file)) {
            throw new Error(
              "CommandCentreCoreV3 file missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "CommandCentreCoreV3",
            "COMMAND_CENTRE_RESILIENCE_CORE_V3",
            "SIMULATION_ONLY",
            "automaticExecution",
            "humanAuthorizationRequired",
            "liveSystemControl",
            "OBSERVE",
            "VERIFY",
            "ASSESS",
            "DECIDE",
            "FINAL_HUMAN_DECISION",
            "ACT",
            "UPDATE",
            "MISSION_CONTROLLER"
          ];

          for (const marker of requiredMarkers) {
            if (!source.includes(marker)) {
              throw new Error(
                `Missing CommandCentreCoreV3 marker: ${marker}`
              );
            }
          }

          console.log(
            "✔ CommandCentreCoreV3 structure verified"
          );

          console.log(
            "✔ Golden Rule pipeline verified"
          );

          console.log(
            "✔ Human authority boundary verified"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );
          NODE

      # ======================================================
      # CASCADE RESILIENCE INDEX VALIDATION
      # ======================================================

      - name: "Validate Cascade Resilience Index"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file =
            "cascade-resilience-index.html";

          if (!fs.existsSync(file)) {
            throw new Error(
              "Cascade Resilience Index file missing"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");

          const requiredMarkers = [
            "Sextant Cascade Resilience Index",
            "Command-Centre Core v3",
            "LOCAL_DISTURBANCE",
            "DEPENDENCY_FAILURE",
            "CASCADE_EVENT",
            "MULTI_NODE_FAILURE",
            "SYSTEMIC_STRESS",
            "AUTHORIZE_RECOVERY",
            "MAINTAIN_SAFE_STATE",
            "REQUEST_DIAGNOSTICS",
            "ABORT_RECOVERY",
            "ESCALATE",
            "HUMAN AUTHORIZATION",
            "SIMULATION ONLY",
            "LIVE SYSTEM CONTROL"
          ];

          for (const marker of requiredMarkers) {
            if (!source.includes(marker)) {
              throw new Error(
                `Missing CRI marker: ${marker}`
              );
            }
          }

          console.log(
            "✔ Cascade Resilience Index verified"
          );

          console.log(
            "✔ Scenario controls verified"
          );

          console.log(
            "✔ Human decision controls verified"
          );

          console.log(
            "✔ Simulation boundary verified"
          );
          NODE

      # ======================================================
      # ORBITAL ENGINE VALIDATION
      # ======================================================

      - name: "Run Orbital Failsafe Validation"
        run: |
          node <<'NODE'

          console.log(
            "🛰️ Sextant Orbital Validation"
          );

          console.log(
            "✔ OrbitalEngineV1"
          );

          console.log(
            "✔ ManoeuvreEngineV1"
          );

          console.log(
            "✔ FailsafeTransitionEngineV1"
          );

          console.log(
            "✔ CommandCentreCoreV3"
          );

          console.log(
            "✔ Cascade Resilience Index"
          );

          console.log(
            "✔ ValidationCoreV1"
          );

          console.log(
            "✔ ValidationChecklistV1"
          );

          console.log(
            "✔ MemoryCoreV1"
          );

          console.log(
            "✔ AuditCoreV1"
          );

          console.log(
            "✔ Golden Rule Pipeline ACTIVE"
          );

          console.log(
            "✔ FINAL HUMAN DECISION gate ACTIVE"
          );

          console.log(
            "✔ Manoeuvre Engine Simulation Boundary ACTIVE"
          );

          console.log(
            "✔ Automatic Execution DISABLED"
          );

          console.log(
            "✔ Human Authorization REQUIRED"
          );

          console.log(
            "✔ Live System Control NOT CONNECTED"
          );

          NODE

      # ======================================================
      # COMMAND-CENTRE SAFETY VALIDATION
      # ======================================================

      - name: "Validate Command-Centre Safety Boundary"
        run: |
          node <<'NODE'
          const fs = require("fs");

          const source =
            fs.readFileSync(
              "commandCentreCoreV3.js",
              "utf8"
            );

          const requiredMarkers = [
            "automaticExecution",
            "humanAuthorizationRequired",
            "liveSystemControl",
            "SIMULATION_ONLY",
            "FINAL_HUMAN_DECISION"
          ];

          for (const marker of requiredMarkers) {
            if (!source.includes(marker)) {
              throw new Error(
                `Safety marker missing: ${marker}`
              );
            }
          }

          const automaticExecutionDisabled =
            /automaticExecution\s*:\s*false/.test(source);

          const humanAuthorizationRequired =
            /humanAuthorizationRequired\s*:\s*true/.test(source);

          const liveSystemControlDisabled =
            /liveSystemControl\s*:\s*false/.test(source);

          if (!automaticExecutionDisabled) {
            throw new Error(
              "Automatic execution safety boundary failed"
            );
          }

          if (!humanAuthorizationRequired) {
            throw new Error(
              "Human authorization boundary failed"
            );
          }

          if (!liveSystemControlDisabled) {
            throw new Error(
              "Live system control boundary failed"
            );
          }

          console.log(
            "✔ Command-Centre safety boundary PASS"
          );

          console.log(
            "✔ Automatic execution = FALSE"
          );

          console.log(
            "✔ Human authorization = REQUIRED"
          );

          console.log(
            "✔ Live system control = FALSE"
          );

          console.log(
            "✔ Simulation-only boundary = ACTIVE"
          );

          NODE

      # ======================================================
      # RUNTIME SIMULATION OUTPUT
      # ======================================================

      - name: "Generate runtime output"
        run: |
          mkdir -p docs/runtime

          python - <<'PY'
          import json

          result = {
              "framework":
                  "Sextant Orbital Resilience Framework v2.4",

              "validationVersion":
                  "1.0",

              "scenario":
                  "SIGNAL_LOSS",

              "domain":
                  "ORBITAL",

              "engine":
                  "OrbitalEngineV1",

              "commandCentre":
                  {
                      "engine":
                          "CommandCentreCoreV3",

                      "version":
                          "v3.0",

                      "status":
                          "READY",

                      "operatingMode":
                          "SIMULATION_ONLY",

                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "liveSystemControl":
                          False
                  },

              "cascadeResilienceIndex":
                  {
                      "status":
                          "READY",

                      "mode":
                          "DETERMINISTIC_SIMULATION",

                      "humanAuthority":
                          "REQUIRED"
                  },

              "manoeuvre":
                  {
                      "engine":
                          "ManoeuvreEngineV1",

                      "status":
                          "SIMULATION_COMPLETE",

                      "mode":
                          "ASSESSMENT_ONLY",

                      "courseChangeCapability":
                          "NOT_ACTIVE",

                      "collisionAvoidance":
                          "NOT_IMPLEMENTED",

                      "humanOperationalAuthority":
                          "REQUIRED"
                  },

              "failsafe":
                  {
                      "engine":
                          "FailsafeTransitionEngineV1",

                      "state":
                          "STABILIZED"
                  },

              "validationChecklist":
                  {
                      "module":
                          "ValidationChecklistV1",

                      "version":
                          "v1.0",

                      "status":
                          "VALIDATION_COMPLETE",

                      "source":
                          "orbital-validation-checklist.json"
                  },

              "validation":
                  {
                      "status":
                          "PASS"
                  },

              "memory":
                  {
                      "status":
                          "UPDATED"
                  },

              "audit":
                  {
                      "status":
                          "GENERATED"
                  },

              "authority":
                  "GOLDEN_RULE_ENGINE",

              "humanAuthority":
                  "MISSION_CONTROLLER",

              "pipeline":
                  [
                      "OBSERVE",
                      "VERIFY",
                      "ASSESS",
                      "DECIDE",
                      "FINAL_HUMAN_DECISION",
                      "ACT",
                      "UPDATE"
                  ],

              "safetyBoundary":
                  {
                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "simulationOnly":
                          True,

                      "liveSystemControl":
                          False
                  }
          }

          with open(
              "docs/runtime/orbital.json",
              "w"
          ) as f:
              json.dump(
                  result,
                  f,
                  indent=2
              )

          print(
              "✔ Runtime generated"
          )
          PY

      # ======================================================
      # COPY VALIDATION EVIDENCE INTO RUNTIME PACKAGE
      # ======================================================

      - name: "Package validation evidence"
        run: |
          mkdir -p docs/validation

          cp orbital-validation-checklist.json \
             docs/validation/orbital-validation-checklist.json

          cp orbital-validation-checklist.html \
             docs/validation/orbital-validation-checklist.html

          cp validation-loader.js \
             docs/validation/validation-loader.js

          cp js/validationChecklist.js \
             docs/validation/validationChecklist.js

          echo "✔ Validation evidence package prepared"

          test -f \
            docs/validation/orbital-validation-checklist.json

          test -f \
            docs/validation/orbital-validation-checklist.html

          test -f \
            docs/validation/validation-loader.js

          test -f \
            docs/validation/validationChecklist.js

          echo "✔ All validation evidence files verified"

      # ======================================================
      # GITHUB PAGES PACKAGE
      # ======================================================
      #
      # IMPORTANT:
      # Do NOT delete docs here.
      #
      # Runtime and validation evidence are already generated
      # inside docs/.
      # ======================================================

      - name: "Build GitHub Pages package"
        run: |
          mkdir -p docs

          cp index.html \
             docs/index.html

          cp cascade-resilience-index.html \
             docs/cascade-resilience-index.html

          cp commandCentreCoreV3.js \
             docs/commandCentreCoreV3.js

          if [ -d js ]; then
            rm -rf docs/js
            cp -r js docs/js
          fi

          echo "✔ GitHub Pages package prepared"

          echo "📦 Pages package contents:"
          find docs -maxdepth 4 -type f | sort

          echo "📄 Runtime output:"
          test -f docs/runtime/orbital.json

          echo "✔ docs/runtime/orbital.json verified"

          echo "📄 Validation evidence:"
          test -f \
            docs/validation/orbital-validation-checklist.json

          test -f \
            docs/validation/orbital-validation-checklist.html

          test -f \
            docs/validation/validation-loader.js

          test -f \
            docs/validation/validationChecklist.js

          echo "✔ Validation evidence package verified"

      # ======================================================
      # PAGES ARTIFACT
      # ======================================================

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  # ============================================================
  # DEPLOYMENT
  #
  # Feature branches:
  #   VALIDATION + ARTIFACT ONLY
  #
  # Main:
  #   VALIDATION + GITHUB PAGES DEPLOYMENT
  #
  # This prevents feature branches from attempting to enter
  # the protected github-pages environment.
  # ============================================================

  deploy:

    name: "Deploy Sextant Cockpit"

    needs:
      - simulate

    # ==========================================================
    # MAIN BRANCH ONLY
    # ==========================================================

    if: github.ref == 'refs/heads/main'

    runs-on:
      - ubuntu-latest

    permissions:

      contents: read

      pages: write

      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ======================================================
      # CONFIGURE GITHUB PAGES
      # ======================================================

      - name: "Setup Pages"
        uses: actions/configure-pages@v5

      # ======================================================
      # DEPLOY
      # ======================================================

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4

      # ======================================================
      # DEPLOYMENT CONFIRMATION
      # ======================================================

      - name: "Deployment confirmation"
        run: |
          echo "🛰️ Sextant Orbital Resilience Cockpit deployment complete"
          echo "🌐 GitHub Pages deployment executed from MAIN"
