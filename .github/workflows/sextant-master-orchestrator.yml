name: "Sextant JavaScript Syntax Diagnostic"

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  javascript-syntax:

    name: "Find JavaScript Syntax Error"

    runs-on: ubuntu-latest

    steps:

      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Find JavaScript syntax error"
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Checking JavaScript syntax"
          echo "========================================"
          echo ""

          find . \
            -type f \
            -name "*.js" \
            -not -path "./node_modules/*" \
            -print \
            | sort \
            | while read -r file
          do
            echo "----------------------------------------"
            echo "Checking: $file"
            echo "----------------------------------------"

            node --check "$file"

            echo "✔ PASS: $file"
            echo ""
          done

          echo "========================================"
          echo "✔ JavaScript syntax check complete"
          echo "========================================"