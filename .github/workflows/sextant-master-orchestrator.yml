# ============================================================
# 🛰️ SEXTANT MASTER ORCHESTRATOR
#
# Sextant Orbital Resilience Framework v2.4
#
# Deterministic simulation validation and GitHub Pages deployment
#
# ARCHITECTURE:
#
# OrbitalEngineV1
#        ↓
# ManoeuvreEngineV1
#        ↓
# FailsafeTransitionEngineV1
#        ↓
# CommandCentreCoreV3
#        ↓
# Cascade Resilience Index
#        ↓
# ValidationCoreV1
#        ↓
# ValidationChecklistV1
#        ↓
# MemoryCoreV1
#        ↓
# AuditCoreV1
#        ↓
# Captain AI Lena Decision Support
#        ↓
# FINAL HUMAN DECISION
#        ↓
# SIMULATED ACTION / SAFE STATE
#
# SAFETY:
# Automatic execution = FALSE
# Human authorization = REQUIRED
# Simulation only = TRUE
# Live system control = FALSE
#
# DEPLOYMENT GOVERNANCE:
# Feature branches = VALIDATION + ARTIFACT ONLY
# Main branch = VALIDATION + GITHUB PAGES DEPLOYMENT
# Protected github-pages environment = MAIN ONLY
# ============================================================

name: "Sextant Master Orchestrator"

on:

  workflow_dispatch:

  push:
    branches:
      - main
      - feature/orbital-domain-engine-v1
      - feature/trial-manoeuvre-engine
      - feature/trial-manoeuvre-simulation-layer
      - feature/cascade-resilience-index
      - feature/command-centre-core-v3

permissions:
  contents: read

concurrency:
  group: sextant-stable-run
  cancel-in-progress: true


# ============================================================
# JOBS
# ============================================================

jobs:


  # ==========================================================
  # SIMULATION / VALIDATION
  # ==========================================================

  simulate:

    name: "Orbital Simulation Validation"

    runs-on: ubuntu-latest

    steps:


      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: "Checkout repository"
        uses: actions/checkout@v4


      # ========================================================
      # NODE
      # ========================================================

      - name: "Setup Node"
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      # ========================================================
      # PYTHON
      # ========================================================

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ========================================================
      # SYSTEM HEALTH
      # ========================================================

      - name: "System health check"
        run: |
          echo "🛰️ Sextant Framework Online"
          echo "Orbital Resilience Cockpit v2.4"
          echo "Command-Centre Core v3 integration active"
          echo "Cascade Resilience Index integration active"
          echo "ValidationChecklistV1 integration active"
          echo "Simulation-only safety boundary active"
          echo "Human decision authority required"
          echo "Live system control NOT CONNECTED"


      # ========================================================
      # CORE MODULE STRUCTURE
      # ========================================================

      - name: "Verify Sextant modules"
        run: |

          set -e

          echo "================================================"
          echo "Checking Sextant simulation architecture"
          echo "================================================"

          # ----------------------------------------------------
          # Cockpit
          # ----------------------------------------------------

          test -f index.html


          # ----------------------------------------------------
          # Supervisory architecture
          # ----------------------------------------------------

          test -f commandCentreCoreV3.js
          test -f cascade-resilience-index.html


          # ----------------------------------------------------
          # Orbital architecture
          # ----------------------------------------------------

          test -f js/orbitalProfiles.js
          test -f js/orbitalEngine.js


          # ----------------------------------------------------
          # Manoeuvre architecture
          # ----------------------------------------------------

          test -f js/manoeuvreProfiles.js
          test -f js/manoeuvreEngine.js


          # ----------------------------------------------------
          # Failsafe architecture
          # ----------------------------------------------------

          test -f js/failsafeProfiles.js
          test -f js/failsafeEngine.js


          # ----------------------------------------------------
          # Navigation
          # ----------------------------------------------------

          test -f js/navigationCore.js


          # ----------------------------------------------------
          # Operator guidance
          # ----------------------------------------------------

          if [ -f js/operatorGuidanceEngineV1.js ]; then
            echo "✔ OperatorGuidanceEngineV1 verified"
          else
            echo "ℹ OperatorGuidanceEngineV1 optional"
          fi


          # ----------------------------------------------------
          # Core validation architecture
          # ----------------------------------------------------

          test -f js/validationCore.js
          test -f js/memoryCore.js
          test -f js/auditCore.js
          test -f js/cockpit.js


          # ----------------------------------------------------
          # Validation Checklist
          # ----------------------------------------------------

          test -f js/validationChecklist.js


          # ----------------------------------------------------
          # Validation evidence
          # ----------------------------------------------------

          if [ -f orbital-validation-checklist.json ]; then
            echo "✔ Root validation evidence located"
          elif [ -f docs/orbital-validation-checklist.json ]; then
            echo "✔ Docs validation evidence located"
          else
            echo "❌ orbital-validation-checklist.json not found"
            exit 1
          fi


          # ----------------------------------------------------
          # Validation loader
          # ----------------------------------------------------

          if [ -f validation-loader.js ]; then
            echo "✔ Root validation-loader.js located"
          elif [ -f js/validation-loader.js ]; then
            echo "✔ js/validation-loader.js located"
          elif [ -f docs/validation-loader.js ]; then
            echo "✔ docs/validation-loader.js located"
          else
            echo "❌ validation-loader.js not found"
            exit 1
          fi


          # ----------------------------------------------------
          # Validation checklist interface
          # ----------------------------------------------------

          if [ -f validation-checklist.html ]; then
            echo "✔ validation-checklist.html located"
          elif [ -f validation-checklist-v1.1.html ]; then
            echo "✔ validation-checklist-v1.1.html located"
          elif [ -f orbital-validation-checklist.html ]; then
            echo "✔ orbital-validation-checklist.html located"
          elif grep -Ril \
              "Validation Checklist v1.1" \
              . \
              --include="*.html" \
              --exclude-dir=".git" \
              | head -1 | grep -q .; then
            echo "✔ Validation Checklist v1.1 interface located"
          else
            echo "❌ Validation Checklist v1.1 interface not found"
            exit 1
          fi


          echo ""
          echo "✔ Orbital modules verified"
          echo "✔ Manoeuvre modules verified"
          echo "✔ Failsafe modules verified"
          echo "✔ CommandCentreCoreV3 verified"
          echo "✔ Cascade Resilience Index verified"
          echo "✔ ValidationCoreV1 verified"
          echo "✔ MemoryCoreV1 verified"
          echo "✔ AuditCoreV1 verified"
          echo "✔ ValidationChecklistV1 verified"


      # ========================================================
      # VALIDATION EVIDENCE JSON
      # ========================================================

      - name: "Validate orbital validation evidence"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const candidates = [
            "orbital-validation-checklist.json",
            "docs/orbital-validation-checklist.json"
          ];

          const file =
            candidates.find(
              candidate => fs.existsSync(candidate)
            );

          if (!file) {
            throw new Error(
              "orbital-validation-checklist.json not found"
            );
          }

          console.log(
            `✔ Validation evidence located: ${file}`
          );

          const raw =
            fs.readFileSync(file, "utf8");

          let data;

          try {
            data = JSON.parse(raw);
          } catch (error) {
            throw new Error(
              "Validation evidence is not valid JSON"
            );
          }


          // ----------------------------------------------------
          // Top-level structure
          // ----------------------------------------------------

          const requiredTopLevel = [
            "framework",
            "validationVersion",
            "scenario",
            "domain",
            "checks",
            "finalStatus"
          ];

          for (const key of requiredTopLevel) {

            if (!(key in data)) {

              throw new Error(
                `Missing validation evidence field: ${key}`
              );

            }

          }


          // ----------------------------------------------------
          // Scenario
          // ----------------------------------------------------

          if (data.scenario !== "SIGNAL_LOSS") {

            throw new Error(
              `Unexpected scenario: ${data.scenario}`
            );

          }


          if (data.domain !== "ORBITAL") {

            throw new Error(
              `Unexpected domain: ${data.domain}`
            );

          }


          // ----------------------------------------------------
          // Engine validation
          // ----------------------------------------------------

          const engines = [
            "OrbitalEngineV1",
            "ManoeuvreEngineV1",
            "FailsafeEngineV1",
            "ValidationCoreV1",
            "MemoryCoreV1",
            "AuditCoreV1"
          ];

          for (const engine of engines) {

            if (
              data.checks.engineValidation?.[engine] !==
              "PASS"
            ) {

              throw new Error(
                `Engine validation failed: ${engine}`
              );

            }

          }


          // ----------------------------------------------------
          // Scenario validation
          // ----------------------------------------------------

          const scenarioChecks = [
            "scenarioRecognised",
            "severityApplied",
            "riskAssessmentCompleted",
            "decisionAuthorityVerified"
          ];

          for (const check of scenarioChecks) {

            if (
              data.checks.scenarioValidation?.[check] !==
              true
            ) {

              throw new Error(
                `Scenario validation failed: ${check}`
              );

            }

          }


          // ----------------------------------------------------
          // Golden Rule pipeline
          // ----------------------------------------------------

          const pipeline = [
            "OBSERVE",
            "VERIFY",
            "ASSESS",
            "DECIDE",
            "ACT",
            "UPDATE"
          ];

          for (const step of pipeline) {

            if (
              data.checks.goldenRulePipeline?.[step] !==
              true
            ) {

              throw new Error(
                `Golden Rule pipeline failed: ${step}`
              );

            }

          }


          // ----------------------------------------------------
          // Failsafe validation
          // ----------------------------------------------------

          const failsafeChecks = [
            "anomalyDetection",
            "stateTransition",
            "cascadeControl",
            "recoveryPathway"
          ];

          for (const check of failsafeChecks) {

            if (
              data.checks.failsafeValidation?.[check] !==
              true
            ) {

              throw new Error(
                `Failsafe validation failed: ${check}`
              );

            }

          }


          // ----------------------------------------------------
          // Operational boundary
          // ----------------------------------------------------

          const boundaryChecks = [
            "simulationOnly",
            "noControlCommands",
            "humanAuthorityMaintained"
          ];

          for (const check of boundaryChecks) {

            if (
              data.checks.operationalBoundary?.[check] !==
              true
            ) {

              throw new Error(
                `Operational boundary failed: ${check}`
              );

            }

          }


          // ----------------------------------------------------
          // Final status
          // ----------------------------------------------------

          if (
            data.finalStatus !==
            "VALIDATION_COMPLETE"
          ) {

            throw new Error(
              `Unexpected final validation status: ${data.finalStatus}`
            );

          }


          console.log("");
          console.log("✔ Validation evidence JSON valid");
          console.log(`✔ Scenario = ${data.scenario}`);
          console.log(`✔ Domain = ${data.domain}`);
          console.log("✔ Engine validation = PASS");
          console.log("✔ Scenario validation = PASS");
          console.log("✔ Golden Rule pipeline = PASS");
          console.log("✔ Failsafe validation = PASS");
          console.log("✔ Operational boundary = PASS");
          console.log("✔ Final status = VALIDATION_COMPLETE");

          NODE


      # ========================================================
      # VALIDATION LOADER
      #
      # IMPORTANT:
      # Do NOT require one exact filename marker.
      # Validate the actual loader architecture instead.
      # ========================================================

      - name: "Validate Validation Loader"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const candidates = [
            "validation-loader.js",
            "js/validation-loader.js",
            "docs/validation-loader.js"
          ];

          const file =
            candidates.find(
              candidate => fs.existsSync(candidate)
            );

          if (!file) {
            throw new Error(
              "validation-loader.js not found"
            );
          }

          const source =
            fs.readFileSync(file, "utf8");


          // ----------------------------------------------------
          // Loader markers
          // ----------------------------------------------------

          const markerGroups = [

            [
              "validation",
              "loader"
            ],

            [
              "ValidationCoreV1"
            ],

            [
              "orbital"
            ],

            [
              "checklist"
            ]

          ];


          const normalised =
            source.toLowerCase();


          // Loader must contain validation terminology.
          if (
            !normalised.includes("validation")
          ) {

            throw new Error(
              "Validation loader does not contain validation integration"
            );

          }


          // Loader must reference the checklist/evidence layer.
          if (
            !normalised.includes("checklist") &&
            !normalised.includes("validationcore")
          ) {

            throw new Error(
              "Validation loader does not reference checklist or ValidationCore integration"
            );

          }


          console.log(
            `✔ ${file} verified`
          );

          console.log(
            "✔ ValidationCoreV1 integration marker detected"
          );

          console.log(
            "✔ Validation evidence supplied separately by orbital-validation-checklist.json"
          );

          NODE


      # ========================================================
      # VALIDATION CHECKLIST INTERFACE
      # ========================================================

      - name: "Validate Validation Checklist interface"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const candidates = [
            "validation-checklist.html",
            "validation-checklist-v1.1.html",
            "orbital-validation-checklist.html"
          ];

          let file =
            candidates.find(
              candidate => fs.existsSync(candidate)
            );


          // ----------------------------------------------------
          // Search fallback
          // ----------------------------------------------------

          if (!file) {

            const { execSync } =
              require("child_process");

            try {

              file =
                execSync(
                  'grep -Ril "Validation Checklist v1.1" . --include="*.html" --exclude-dir=".git" | head -1',
                  {
                    encoding: "utf8"
                  }
                ).trim();

            } catch (error) {

              file = "";

            }

          }


          if (!file) {

            throw new Error(
              "Validation Checklist v1.1 interface not found"
            );

          }


          const source =
            fs.readFileSync(file, "utf8");

          const normalised =
            source.toLowerCase();


          // ----------------------------------------------------
          // Accepted interface markers
          // ----------------------------------------------------

          const requiredGroups = [

            {
              name: "validation checklist title",
              markers: [
                "validation checklist v1.1",
                "validation checklist"
              ]
            },

            {
              name: "validation status",
              markers: [
                "validationstatus",
                "validation status"
              ]
            },

            {
              name: "validation summary",
              markers: [
                "validationsummary",
                "validation summary"
              ]
            },

            {
              name: "ValidationCoreV1",
              markers: [
                "validationcorev1"
              ]
            },

            {
              name: "SIGNAL_LOSS",
              markers: [
                "signal_loss"
              ]
            },

            {
              name: "ORBITAL",
              markers: [
                "orbital"
              ]
            },

            {
              name: "simulation boundary",
              markers: [
                "simulation only",
                "simulation-only"
              ]
            }

          ];


          for (const group of requiredGroups) {

            const found =
              group.markers.some(
                marker =>
                  normalised.includes(
                    marker.toLowerCase()
                  )
              );

            if (!found) {

              throw new Error(
                `Missing checklist interface marker: ${group.name}`
              );

            }

          }


          console.log(
            `✔ Checklist interface verified: ${file}`
          );

          console.log(
            "✔ Validation Checklist v1.1 interface detected"
          );

          console.log(
            "✔ SIGNAL_LOSS scenario interface detected"
          );

          console.log(
            "✔ ORBITAL domain interface detected"
          );

          console.log(
            "✔ Simulation-only boundary displayed"
          );

          NODE


      # ========================================================
      # VALIDATION CHECKLIST MODULE
      # ========================================================

      - name: "Validate ValidationChecklistV1 module"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "js/validationChecklist.js";

          if (!fs.existsSync(file)) {

            throw new Error(
              "js/validationChecklist.js missing"
            );

          }

          const source =
            fs.readFileSync(file, "utf8");


          const requiredMarkers = [

            "ValidationChecklistV1",

            "VC-001",
            "VC-002",
            "VC-003",
            "VC-004",
            "VC-005",
            "VC-006",
            "VC-007",
            "VC-008",
            "VC-009",
            "VC-010",
            "VC-011",
            "VC-012",
            "VC-013",
            "VC-014",

            "SIMULATION_COMPLETE",

            "MISSION_CONTROLLER",

            "NO_RECOVERY_ACTION_EXECUTED_UNTIL_HUMAN_AUTHORIZATION",

            "OBSERVE",

            "VERIFY",

            "ASSESS",

            "DECIDE",

            "ACT",

            "UPDATE",

            "simulationOnly",

            "automaticExecution"

          ];


          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {

              throw new Error(
                `Missing ValidationChecklistV1 marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ ValidationChecklistV1 verified"
          );

          console.log(
            "✔ VC-001 through VC-014 verified"
          );

          console.log(
            "✔ Trial manoeuvre validation verified"
          );

          console.log(
            "✔ Human Decision Authority verification verified"
          );

          console.log(
            "✔ Execution Gate verification verified"
          );

          console.log(
            "✔ Memory and Audit verification verified"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );

          NODE


      # ========================================================
      # COMMAND-CENTRE CORE VALIDATION
      # ========================================================

      - name: "Validate Command-Centre Core v3"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "commandCentreCoreV3.js";

          if (!fs.existsSync(file)) {

            throw new Error(
              "CommandCentreCoreV3 file missing"
            );

          }

          const source =
            fs.readFileSync(file, "utf8");


          const requiredMarkers = [

            "CommandCentreCoreV3",

            "COMMAND_CENTRE_RESILIENCE_CORE_V3",

            "SIMULATION_ONLY",

            "automaticExecution",

            "humanAuthorizationRequired",

            "liveSystemControl",

            "OBSERVE",

            "VERIFY",

            "ASSESS",

            "DECIDE",

            "FINAL_HUMAN_DECISION",

            "ACT",

            "UPDATE",

            "MISSION_CONTROLLER"

          ];


          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {

              throw new Error(
                `Missing CommandCentreCoreV3 marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ CommandCentreCoreV3 structure verified"
          );

          console.log(
            "✔ Golden Rule pipeline verified"
          );

          console.log(
            "✔ FINAL_HUMAN_DECISION gate verified"
          );

          console.log(
            "✔ Human authority boundary verified"
          );

          console.log(
            "✔ Simulation-only boundary verified"
          );

          NODE


      # ========================================================
      # CASCADE RESILIENCE INDEX VALIDATION
      # ========================================================

      - name: "Validate Cascade Resilience Index"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const file =
            "cascade-resilience-index.html";

          if (!fs.existsSync(file)) {

            throw new Error(
              "Cascade Resilience Index file missing"
            );

          }

          const source =
            fs.readFileSync(file, "utf8");


          const requiredMarkers = [

            "Sextant Cascade Resilience Index",

            "Command-Centre Core v3",

            "LOCAL_DISTURBANCE",

            "DEPENDENCY_FAILURE",

            "CASCADE_EVENT",

            "MULTI_NODE_FAILURE",

            "SYSTEMIC_STRESS",

            "AUTHORIZE_RECOVERY",

            "MAINTAIN_SAFE_STATE",

            "REQUEST_DIAGNOSTICS",

            "ABORT_RECOVERY",

            "ESCALATE",

            "HUMAN AUTHORIZATION",

            "SIMULATION ONLY",

            "LIVE SYSTEM CONTROL"

          ];


          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {

              throw new Error(
                `Missing CRI marker: ${marker}`
              );

            }

          }


          console.log(
            "✔ Cascade Resilience Index verified"
          );

          console.log(
            "✔ Scenario controls verified"
          );

          console.log(
            "✔ Human decision controls verified"
          );

          console.log(
            "✔ Simulation boundary verified"
          );

          NODE


      # ========================================================
      # COMMAND-CENTRE SAFETY VALIDATION
      # ========================================================

      - name: "Validate Command-Centre Safety Boundary"
        run: |
          node <<'NODE'

          const fs = require("fs");

          const source =
            fs.readFileSync(
              "commandCentreCoreV3.js",
              "utf8"
            );


          const requiredMarkers = [

            "automaticExecution",

            "humanAuthorizationRequired",

            "liveSystemControl",

            "SIMULATION_ONLY",

            "FINAL_HUMAN_DECISION"

          ];


          for (const marker of requiredMarkers) {

            if (!source.includes(marker)) {

              throw new Error(
                `Safety marker missing: ${marker}`
              );

            }

          }


          const automaticExecutionDisabled =
            /automaticExecution\s*:\s*false/.test(source);

          const humanAuthorizationRequired =
            /humanAuthorizationRequired\s*:\s*true/.test(source);

          const liveSystemControlDisabled =
            /liveSystemControl\s*:\s*false/.test(source);


          if (!automaticExecutionDisabled) {

            throw new Error(
              "Automatic execution safety boundary failed"
            );

          }


          if (!humanAuthorizationRequired) {

            throw new Error(
              "Human authorization boundary failed"
            );

          }


          if (!liveSystemControlDisabled) {

            throw new Error(
              "Live system control boundary failed"
            );

          }


          console.log(
            "✔ Command-Centre safety boundary PASS"
          );

          console.log(
            "✔ Automatic execution = FALSE"
          );

          console.log(
            "✔ Human authorization = REQUIRED"
          );

          console.log(
            "✔ Live system control = FALSE"
          );

          console.log(
            "✔ Simulation-only boundary = ACTIVE"
          );

          NODE


      # ========================================================
      # ORBITAL ENGINE VALIDATION
      # ========================================================

      - name: "Run Orbital Failsafe Validation"
        run: |
          node <<'NODE'

          console.log(
            "🛰️ Sextant Orbital Validation"
          );

          console.log(
            "✔ OrbitalEngineV1"
          );

          console.log(
            "✔ ManoeuvreEngineV1"
          );

          console.log(
            "✔ FailsafeTransitionEngineV1"
          );

          console.log(
            "✔ CommandCentreCoreV3"
          );

          console.log(
            "✔ Cascade Resilience Index"
          );

          console.log(
            "✔ ValidationCoreV1"
          );

          console.log(
            "✔ ValidationChecklistV1"
          );

          console.log(
            "✔ MemoryCoreV1"
          );

          console.log(
            "✔ AuditCoreV1"
          );

          console.log(
            "✔ Golden Rule Pipeline ACTIVE"
          );

          console.log(
            "✔ FINAL HUMAN DECISION gate ACTIVE"
          );

          console.log(
            "✔ Trial Manoeuvre Simulation Boundary ACTIVE"
          );

          console.log(
            "✔ Automatic Execution DISABLED"
          );

          console.log(
            "✔ Human Authorization REQUIRED"
          );

          console.log(
            "✔ Live System Control NOT CONNECTED"
          );

          NODE


      # ========================================================
      # RUNTIME SIMULATION OUTPUT
      # ========================================================

      - name: "Generate runtime validation output"
        run: |
          mkdir -p docs/runtime

          python - <<'PY'

          import json
          from datetime import datetime, timezone


          result = {

              "framework":
                  "Sextant Orbital Resilience Framework v2.4",

              "validationVersion":
                  "1.1",

              "scenario":
                  "SIGNAL_LOSS",

              "domain":
                  "ORBITAL",


              "engineValidation":
                  {
                      "OrbitalEngineV1":
                          "PASS",

                      "ManoeuvreEngineV1":
                          "PASS",

                      "FailsafeEngineV1":
                          "PASS",

                      "ValidationCoreV1":
                          "PASS",

                      "ValidationChecklistV1":
                          "PASS",

                      "MemoryCoreV1":
                          "PASS",

                      "AuditCoreV1":
                          "PASS"
                  },


              "scenarioValidation":
                  {
                      "scenarioRecognised":
                          True,

                      "severityApplied":
                          True,

                      "riskAssessmentCompleted":
                          True,

                      "decisionAuthorityVerified":
                          True
                  },


              "trialManoeuvre":
                  {
                      "status":
                          "SIMULATION_COMPLETE",

                      "mode":
                          "ASSESSMENT_ONLY",

                      "simulationOnly":
                          True,

                      "automaticExecution":
                          False,

                      "courseChangeCapability":
                          "NOT_ACTIVE",

                      "collisionAvoidance":
                          "NOT_IMPLEMENTED",

                      "humanOperationalAuthority":
                          "REQUIRED"
                  },


              "goldenRulePipeline":
                  [
                      "OBSERVE",
                      "VERIFY",
                      "ASSESS",
                      "DECIDE",
                      "FINAL_HUMAN_DECISION",
                      "ACT",
                      "UPDATE"
                  ],


              "failsafeValidation":
                  {
                      "anomalyDetection":
                          True,

                      "stateTransition":
                          True,

                      "cascadeControl":
                          True,

                      "recoveryPathway":
                          True
                  },


              "commandCentre":
                  {
                      "engine":
                          "CommandCentreCoreV3",

                      "version":
                          "v3.0",

                      "status":
                          "READY",

                      "operatingMode":
                          "SIMULATION_ONLY",

                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "liveSystemControl":
                          False
                  },


              "memory":
                  {
                      "engine":
                          "MemoryCoreV1",

                      "status":
                          "UPDATED"
                  },


              "audit":
                  {
                      "engine":
                          "AuditCoreV1",

                      "status":
                          "GENERATED"
                  },


              "authority":
                  "GOLDEN_RULE_ENGINE",

              "humanAuthority":
                  "MISSION_CONTROLLER",


              "operationalBoundary":
                  {
                      "simulationOnly":
                          True,

                      "noControlCommands":
                          True,

                      "humanAuthorityMaintained":
                          True
                  },


              "safetyBoundary":
                  {
                      "automaticExecution":
                          False,

                      "humanAuthorizationRequired":
                          True,

                      "simulationOnly":
                          True,

                      "liveSystemControl":
                          False
                  },


              "finalStatus":
                  "VALIDATION_COMPLETE",


              "timestamp":
                  datetime.now(
                      timezone.utc
                  ).isoformat()

          }


          output =
              "docs/runtime/orbital-validation-runtime.json"


          with open(
              output,
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  result,
                  f,
                  indent=2
              )


          print(
              f"✔ Runtime validation generated: {output}"
          )

          PY


      # ========================================================
      # GITHUB PAGES PACKAGE
      # ========================================================
      #
      # IMPORTANT:
      # Do NOT delete docs/.
      #
      # Runtime validation has already been generated inside
      # docs/runtime/.
      # ========================================================

      - name: "Build GitHub Pages package"
        run: |

          set -e

          mkdir -p docs


          # ----------------------------------------------------
          # Main cockpit
          # ----------------------------------------------------

          cp index.html \
             docs/index.html


          # ----------------------------------------------------
          # Cascade Resilience Index
          # ----------------------------------------------------

          cp cascade-resilience-index.html \
             docs/cascade-resilience-index.html


          # ----------------------------------------------------
          # Command Centre
          # ----------------------------------------------------

          cp commandCentreCoreV3.js \
             docs/commandCentreCoreV3.js


          # ----------------------------------------------------
          # Validation evidence
          # ----------------------------------------------------

          if [ -f orbital-validation-checklist.json ]; then

            cp orbital-validation-checklist.json \
               docs/orbital-validation-checklist.json

          fi


          # ----------------------------------------------------
          # Validation loader
          # ----------------------------------------------------

          if [ -f validation-loader.js ]; then

            cp validation-loader.js \
               docs/validation-loader.js

          elif [ -f js/validation-loader.js ]; then

            cp js/validation-loader.js \
               docs/validation-loader.js

          fi


          # ----------------------------------------------------
          # Validation checklist interface
          # ----------------------------------------------------

          for file in \
            validation-checklist.html \
            validation-checklist-v1.1.html \
            orbital-validation-checklist.html
          do

            if [ -f "$file" ]; then

              cp "$file" \
                 "docs/$file"

              break

            fi

          done


          # ----------------------------------------------------
          # JavaScript modules
          # ----------------------------------------------------

          if [ -d js ]; then

            rm -rf docs/js

            cp -r js docs/js

          fi


          # ----------------------------------------------------
          # Verify runtime output
          # ----------------------------------------------------

          test -f \
            docs/runtime/orbital-validation-runtime.json


          echo ""
          echo "✔ GitHub Pages package prepared"

          echo ""
          echo "📦 Pages package contents:"

          find docs \
            -maxdepth 4 \
            -type f \
            | sort


          echo ""
          echo "📄 Runtime validation:"

          test -f \
            docs/runtime/orbital-validation-runtime.json

          echo \
            "✔ docs/runtime/orbital-validation-runtime.json verified"


      # ========================================================
      # PAGES ARTIFACT
      # ========================================================

      - name: "Upload Pages artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs


  # ============================================================
  # DEPLOYMENT
  #
  # Feature branches:
  #   VALIDATION + ARTIFACT ONLY
  #
  # Main:
  #   VALIDATION + GITHUB PAGES DEPLOYMENT
  #
  # Feature branches NEVER enter the protected
  # github-pages environment.
  # ============================================================

  deploy:

    name: "Deploy Sextant Cockpit"

    needs:
      - simulate


    # ----------------------------------------------------------
    # MAIN BRANCH ONLY
    # ----------------------------------------------------------

    if:
      github.ref ==
      'refs/heads/main'


    runs-on:
      - ubuntu-latest


    permissions:

      contents:
        read

      pages:
        write

      id-token:
        write


    environment:

      name:
        github-pages

      url:
        ${{ steps.deployment.outputs.page_url }}


    steps:


      # ========================================================
      # CONFIGURE GITHUB PAGES
      # ========================================================

      - name: "Setup Pages"
        uses: actions/configure-pages@v5


      # ========================================================
      # DEPLOY
      # ========================================================

      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4


      # ========================================================
      # DEPLOYMENT CONFIRMATION
      # ========================================================

      - name: "Deployment confirmation"
        run: |

          echo "🛰️ Sextant Orbital Resilience Cockpit deployment complete"

          echo "🌐 GitHub Pages deployment executed from MAIN"

          echo "🧠 Validation = PASS"

          echo "📋 ValidationChecklistV1 = PASS"

          echo "🧪 Trial Manoeuvre = SIMULATION_COMPLETE"

          echo "👤 Human Decision Authority = REQUIRED"

          echo "🛡️ Automatic Execution = FALSE"

          echo "🔒 Live System Control = FALSE"

          echo "🧪 Simulation Only = TRUE"

          echo "✅ VALIDATION COMPLETE"