name: 🛡️ Guard Layer v1 - Data Protection & Workflow Integrity

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for sensitive workflow changes
        id: scan
        run: |
          echo "🛡️ Guard Layer scanning changes..."

          git fetch origin main --depth=50 || true

          # -----------------------------
          # SAFE BASE/HEAD HANDLING
          # -----------------------------
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # FIX: prevent empty BASE crash
          if [ -z "$BASE" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          if [ -z "$HEAD" ]; then
            HEAD="${{ github.sha }}"
          fi

          echo "BASE=$BASE"
          echo "HEAD=$HEAD"

          CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD" || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          echo "$CHANGED_FILES" > changed_files.txt

          # -----------------------------
          # DETECTION LOGIC
          # -----------------------------
          if echo "$CHANGED_FILES" | grep -E "^\.github/workflows/|\.ya?ml$"; then
            echo "tamper_detected=true" >> $GITHUB_OUTPUT
            echo "⚠️ YAML or workflow modification detected"
          else
            echo "tamper_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No sensitive changes detected"
          fi

      - name: Create protection log
        run: |
          mkdir -p security_logs

          cat <<EOF > security_logs/guard_log.json
          {
            "system": "Sextant Orbital Resilience Framework",
            "module": "Guard Layer v1",
            "status": "completed",
            "tamper_detected": "${{ steps.scan.outputs.tamper_detected }}",
            "event": "${{ github.event_name }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        with:
          name: guard-layer-log
          path: security_logs/

      - name: Enforce rule (kill switch)
        run: |
          if [ "${{ steps.scan.outputs.tamper_detected }}" = "true" ]; then
            echo "🛑 Guard Layer triggered: workflow/YAML change detected"
            exit 1
          fi

          echo "✅ Guard Layer passed"
