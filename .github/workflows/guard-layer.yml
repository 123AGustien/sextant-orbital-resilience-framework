name: 🛡️ Guard Layer - Working + Manual Alert System

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: "working | alert"
        required: true
        default: working

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # MODE CONTROL (OWNER SAFE)
      # -------------------------
      - name: Set execution mode
        id: mode
        run: |
          if [ -z "${{ github.event.inputs.mode }}" ]; then
            MODE="working"
          else
            MODE="${{ github.event.inputs.mode }}"
          fi

          echo "mode=$MODE" >> $GITHUB_OUTPUT
          echo "🧭 Mode selected: $MODE"

      # -------------------------
      # WORKING MODE (AUTOMATIC)
      # -------------------------
      - name: Working Mode Scan
        if: steps.mode.outputs.mode == 'working'
        run: |
          echo "🛡️ WORKING MODE ACTIVE"

          CHANGED=$(git diff --name-only HEAD^ HEAD || true)

          echo "$CHANGED"

          if echo "$CHANGED" | grep -E "\.github/workflows/|\.ya?ml"; then
            echo "⚠️ Workflow/YAML change detected (logged only)"
          fi

          echo "✅ Working scan complete"

      # -------------------------
      # ALERT MODE (MANUAL OWNER)
      # -------------------------
      - name: Alert Mode Report
        if: steps.mode.outputs.mode == 'alert'
        run: |
          echo "🚨 ALERT MODE (OWNER ONLY)"

          echo "Repository state snapshot:"
          git log -1 --stat

          echo "Full file inventory:"
          git ls-files

          echo "No enforcement applied - report only"

      # -------------------------
      # AUDIT LOG (ALWAYS)
      # -------------------------
      - name: Create audit log
        run: |
          mkdir -p security_logs

          cat <<EOF > security_logs/guard_audit.json
          {
            "mode": "${{ steps.mode.outputs.mode }}",
            "repo": "${{ github.repository }}",
            "event": "${{ github.event_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: guard-audit-log
          path: security_logs/
