name: 🛡️ Guard Layer v3 - Dual Mode Protection System

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      strict_mode:
        description: "Enable strict blocking mode"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: scan
        run: |
          echo "🛡️ Guard Layer scanning..."

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          CHANGED_FILES=$(git diff --name-only $BASE $HEAD || true)

          echo "$CHANGED_FILES"

          echo "$CHANGED_FILES" > changed_files.txt

          # detect workflow changes
          if echo "$CHANGED_FILES" | grep -E "\.github/workflows/|\.ya?ml"; then
            echo "tamper=true" >> $GITHUB_OUTPUT
          else
            echo "tamper=false" >> $GITHUB_OUTPUT
          fi

      - name: Create audit log
        run: |
          mkdir -p logs

          cat <<EOF > logs/guard.json
          {
            "system": "Sextant Framework",
            "mode": "guard-v3",
            "tamper_detected": "${{ steps.scan.outputs.tamper }}",
            "event": "${{ github.event_name }}",
            "strict_mode": "${{ github.event.inputs.strict_mode }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: guard-log
          path: logs/

      - name: Enforce rule (STRICT ONLY)
        run: |
          if [ "${{ steps.scan.outputs.tamper }}" = "true" ]; then

            if [ "${{ github.event.inputs.strict_mode }}" = "true" ]; then
              echo "🛑 STRICT MODE: Blocking change"
              exit 1
            else
              echo "⚠️ WARNING MODE: Change detected but allowed"
            fi

          else
            echo "✅ Clean system state"
          fi
