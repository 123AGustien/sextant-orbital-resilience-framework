name: 🛡️ Guard Layer v1 - Data Protection & Workflow Integrity

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository changes
        id: detect
        run: |
          echo "🛡️ Guard Layer scanning changes..."

          git fetch origin main

          CHANGED_FILES=$(git diff --name-only origin/main...HEAD || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          echo "$CHANGED_FILES" > changed_files.txt

          if echo "$CHANGED_FILES" | grep -E "\.github/workflows/|\.yml|\.yaml"; then
            echo "tamper_detected=true" >> $GITHUB_OUTPUT
            echo "⚠️ Workflow or YAML change detected"
          else
            echo "tamper_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No workflow changes detected"
          fi

      - name: Create Security Log
        run: |
          mkdir -p security_logs

          cat <<EOF > security_logs/guard_layer_log.json
          {
            "system": "Sextant Orbital Resilience Framework",
            "module": "Guard Layer v1",
            "status": "completed",
            "tamper_detected": "${{ steps.detect.outputs.tamper_detected }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload Log Artifact
        uses: actions/upload-artifact@v4
        with:
          name: guard-layer-log
          path: security_logs/

      - name: Enforce Rule (fail only if tampering detected)
        run: |
          if [ "${{ steps.detect.outputs.tamper_detected }}" = "true" ]; then
            echo "🛑 Guard Layer: YAML or workflow modification detected"
            exit 1
          fi

      - name: System OK
        run: |
          echo "✅ Guard Layer passed - system stable"
