name: 🛡️ Guard Layer v1 - Data Protection & Workflow Integrity

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository safely (NO FAIL MODE)
        id: scan
        run: |
          echo "🛡️ Guard Layer scanning changes..."

          # Ensure we always have full history
          git fetch origin main --depth=0 || true

          # -----------------------------
          # SAFE PR DETECTION (NO GITHUB VARIABLES)
          # -----------------------------
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            BASE=$(git merge-base HEAD origin/main || git rev-parse HEAD~1)
          else
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi

          HEAD=$(git rev-parse HEAD)

          echo "BASE=$BASE"
          echo "HEAD=$HEAD"

          CHANGED_FILES=$(git diff --name-only "$BASE" "$HEAD" || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          echo "$CHANGED_FILES" > changed_files.txt

          # -----------------------------
          # DETECTION LOGIC
          # -----------------------------
          if echo "$CHANGED_FILES" | grep -E "^\.github/workflows/|\.ya?ml$"; then
            echo "tamper_detected=true" >> $GITHUB_OUTPUT
            echo "⚠️ YAML/workflow modification detected"
          else
            echo "tamper_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No sensitive changes detected"
          fi

      - name: Create protection log
        run: |
          mkdir -p security_logs

          cat <<EOF > security_logs/guard_log.json
          {
            "system": "Sextant Orbital Resilience Framework",
            "module": "Guard Layer v1",
            "status": "completed",
            "tamper_detected": "${{ steps.scan.outputs.tamper_detected }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload log artifact
        uses: actions/upload-artifact@v4
        with:
          name: guard-layer-log
          path: security_logs/

      - name: Enforce rule (kill switch)
        run: |
          if [ "${{ steps.scan.outputs.tamper_detected }}" = "true" ]; then
            echo "🛑 Guard Layer triggered"
            exit 1
          fi

          echo "✅ Guard Layer passed"
